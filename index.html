<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KelasKu — Administrasi Guru SD</title>
<meta name="theme-color" content="#1b1446">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--ink:#1b1f3b;--mut:#6a6f8f;--bg:#eceaff;--p:#6d4aff;--p2:#4b2fd0;--t:#00b8a0;--t2:#008f7d;--a:#ffb020;--a2:#d68a00;--r:#ff4d6d;--r2:#c9304c;--rad:20px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#d9d2ff,transparent),radial-gradient(900px 500px at 100% 10%,#c9f6ee,transparent),var(--bg);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h2,h3,h4{line-height:1.25}.mut,small{color:var(--mut)}
/* latar kubus 3D */
.bg3d{position:fixed;inset:0;perspective:900px;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-28px)}}
.cube{--s:80px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-style:normal;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);border-radius:10px}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.cube.bg i{background:linear-gradient(135deg,rgba(109,74,255,.22),rgba(0,184,160,.18));border:1px solid rgba(109,74,255,.3)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
.scene{perspective:600px;width:130px;height:130px;display:grid;place-items:center;flex:none}
/* header + drawer */
header{position:fixed;inset:0 0 auto 0;height:64px;z-index:30;background:linear-gradient(135deg,#1b1446,#2d1f78);display:flex;align-items:center;gap:12px;padding:0 14px;color:#fff;box-shadow:0 6px 0 rgba(27,20,70,.2),0 14px 30px rgba(27,20,70,.35)}
.burger{width:44px;height:44px;border-radius:14px;border:0;font-size:22px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#5b46c9,#3a2a9a);box-shadow:0 4px 0 #20156b}
.burger:active{transform:translateY(3px);box-shadow:0 1px 0 #20156b}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,#ffd35a,#ff9d00);color:#4a2d00;box-shadow:0 4px 0 #b36b00,0 8px 14px rgba(0,0,0,.3);transform:rotate(-6deg)}
.brand{flex:1;min-width:0;line-height:1.15}.brand small{color:#b7aaff;display:block}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(145deg,#00d6bb,#00907d);box-shadow:0 4px 0 #006054}
#ov{position:fixed;inset:0;background:rgba(20,10,60,.45);z-index:24;display:none}#ov.on{display:block}
nav{position:fixed;top:64px;bottom:0;left:0;width:280px;z-index:25;background:#fff;padding:12px;overflow:auto;transform:translateX(-104%);transition:transform .3s;box-shadow:10px 0 30px rgba(40,20,120,.25)}
nav.open{transform:none}
.ni{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;font-weight:650;cursor:pointer;margin-bottom:4px;transition:.2s;user-select:none}
.ni .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#fff,#e6e2ff);box-shadow:0 4px 0 #c9c2f5,0 8px 12px rgba(80,60,200,.18);transition:.2s}
.ni:hover .ic{transform:translateY(-2px) rotate(-6deg)}
.ni.on{background:linear-gradient(135deg,#efeaff,#dffaf4);color:var(--p2)}
main{position:relative;z-index:1;padding:84px 16px 48px}.wrap{max-width:1000px;margin:auto}
@media(min-width:980px){nav{transform:none}main{margin-left:280px}.burger{display:none}#ov{display:none!important}}
/* komponen 3D */
.card{background:#fff;border-radius:var(--rad);padding:16px;box-shadow:0 6px 0 #d8d3f7,0 18px 30px rgba(60,40,160,.16);transition:transform .15s ease-out,box-shadow .2s;will-change:transform;margin-bottom:16px;display:block;color:inherit;text-decoration:none}
.card h3{margin-bottom:10px}
.btn{--c1:#8a6cff;--c2:var(--p);--sh:var(--p2);border:0;cursor:pointer;font:inherit;font-weight:750;color:#fff;padding:11px 18px;border-radius:14px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--sh),0 12px 18px rgba(60,40,160,.3);transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(60,40,160,.25)}
.btn.t{--c1:#2fdcc5;--c2:var(--t);--sh:var(--t2)}
.btn.a{--c1:#ffd35a;--c2:var(--a);--sh:var(--a2);color:#432a00}
.btn.r{--c1:#ff7b93;--c2:var(--r);--sh:var(--r2)}
.btn.g{--c1:#fff;--c2:#f1eeff;--sh:#cfc8f7;color:var(--p2)}
.btn.s{padding:7px 12px;font-size:14px;border-radius:11px;box-shadow:0 4px 0 var(--sh),0 8px 12px rgba(60,40,160,.2)}
.btn:disabled{opacity:.7;cursor:wait}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border-radius:12px;border:2px solid #ddd8fb;background:#faf9ff;color:var(--ink);box-shadow:inset 0 3px 6px rgba(80,60,200,.08)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label{display:block;font-weight:650;font-size:14px;margin:12px 0 5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:16px}
.grid .card{margin:0}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
.bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.bar input{flex:1;min-width:150px}
.item{display:flex;gap:12px;align-items:center}
.ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(145deg,#fff,#e6e2ff);box-shadow:0 5px 0 #c9c2f5,0 10px 14px rgba(80,60,200,.2)}
.im{flex:1;min-width:0}.im small{display:block}.im p{margin-top:6px;font-size:14px;white-space:pre-wrap}
.ia{display:flex;gap:8px;flex:none}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}.empty b{font-size:42px;display:block}
.hero{display:flex;gap:10px;align-items:center;justify-content:space-between;color:#fff;border-radius:26px;padding:22px;margin-bottom:18px;background:linear-gradient(135deg,#1b1446,#4b2fd0 60%,#00b8a0);box-shadow:0 8px 0 #130c36,0 22px 36px rgba(40,20,140,.4);transition:transform .15s ease-out}
.hero h2{font-size:24px;margin:4px 0}.hero p{opacity:.85;margin-bottom:14px}.hero small{color:#cfc6ff}
.stat{text-align:center}.stat span{font-size:30px;display:block}.stat b{font-size:30px;display:block}
.chip{display:inline-block;padding:6px 12px;border-radius:12px;font-weight:700;color:#fff;margin:0 6px 6px 0;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.c-H{background:var(--t)}.c-S{background:var(--a);color:#432a00}.c-I{background:#3b82f6}.c-A{background:var(--r)}
.ab{display:flex;gap:6px}.ab button{width:40px;height:40px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer;background:#efecff;color:var(--p2);box-shadow:0 4px 0 #cfc8f7}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc8f7}
.ab button.on{color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ab button.on[data-v=H]{background:var(--t)}.ab button.on[data-v=S]{background:var(--a);color:#432a00}.ab button.on[data-v=I]{background:#3b82f6}.ab button.on[data-v=A]{background:var(--r)}
.tbl{overflow:auto}.tbl table,#printArea table{border-collapse:collapse;width:100%}.tbl td,.tbl th{padding:8px 10px;border-bottom:1px solid #e6e2ff;text-align:left;font-size:14px;vertical-align:top}.tbl th{background:#f4f1ff}
.p5{display:flex;flex-wrap:wrap;gap:8px}.p5 label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500;background:#f4f1ff;padding:7px 10px;border-radius:12px}.p5 input{width:auto;box-shadow:none}
.sec{border-left:5px solid var(--p);padding-left:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,10,60,.55);display:none;z-index:50;padding:16px;overflow:auto;backdrop-filter:blur(4px)}
.modal.on{display:grid;place-items:center}.mbox{width:100%;max-width:520px;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1b1446;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;transition:.3s;box-shadow:0 5px 0 #0c0726;max-width:90vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.ab button.on[data-v=B]{background:var(--r)}.ab button.on[data-v=K]{background:var(--a);color:#432a00}.ab button.on[data-v=C]{background:var(--t)}.ab button.on[data-v=M]{background:var(--p)}
.cmp{border-collapse:collapse;font-size:12px;width:100%}.cmp th,.cmp td{border:1px solid #cfc8f7;padding:4px 5px;text-align:center}.cmp td:nth-child(2),.cmp th:nth-child(2){text-align:left;white-space:nowrap}
.note{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #e6e2ff;padding:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .hd{text-align:center;font-weight:700;font-size:12px;color:var(--mut)}.cal .cd{min-height:54px;border-radius:10px;background:#faf9ff;padding:4px;font-size:12px;overflow:hidden}.cal .cd.t{outline:2px solid var(--p);background:#efeaff}
@media print{#printArea .cmp td,#printArea .cmp th{text-align:center;padding:2px 3px;font-size:10px}#printArea .cmp td:nth-child(2){text-align:left}}
#printArea{display:none}
.pb{page-break-after:always;break-after:page}
.fobar{padding:14px 16px}.fobar input{margin-bottom:8px}.fo{margin:10px 0}.foh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 16px;border:0;border-radius:18px;background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #d9d3ff,0 10px 18px rgba(80,60,200,.12)}.foh .n{margin-left:auto;background:#ece9ff;color:var(--p2);border-radius:999px;padding:2px 11px;font-size:12px}.fob{margin:10px 0 0 10px;padding-left:10px;border-left:3px solid #d9d3ff}.fob[hidden],.foi[hidden],.fo[hidden],.foempty[hidden]{display:none}
.mdprev table{width:100%;border-collapse:collapse;margin:4px 0}.mdprev td,.mdprev th{border:1px solid #cfc8f7;padding:6px 8px;font-size:13px;vertical-align:top;text-align:left}.mdprev h3{margin:10px 0 4px;font-size:15px}.mdprev .pb{border-top:2px dashed #c9c2ff;margin:10px 0}
.brand small.cr{font-size:10.5px;line-height:1.2;margin-top:2px}#ptitle{max-width:1000px;margin:0 auto 14px;font-size:22px}.ncr{margin:18px 8px 8px;padding-top:12px;border-top:1px dashed #d8d3f7;font-size:12px;color:var(--mut);text-align:center;line-height:1.5}.ncr b{color:var(--p2);font-size:14px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff;padding:8mm}
#printArea td,#printArea th{border:1px solid #000;padding:4px 6px;font-size:12px;vertical-align:top;text-align:left}
.kop{text-align:center;border-bottom:3px double #000;margin-bottom:12px;padding-bottom:6px}.ttd{display:flex;justify-content:space-between;margin-top:36px}.ttd div{text-align:center;width:42%}.pw{white-space:pre-wrap;font-size:13px}}
</style>
</head>
<body>
<div class="bg3d" id="bg"></div>
<header>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="logo">KK</div>
  <div class="brand"><b>KelasKu</b><small class="cr">Design by Akhmad Fitra Harry, S.Pd</small></div>
  <div class="av" id="av">GR</div>
</header>
<div id="ov"></div>
<nav id="drawer"></nav>
<main><h2 id="ptitle"></h2><div id="view"></div></main>
<div class="modal" id="modal"><form id="mf" class="card mbox"><h3 id="mt"></h3><div id="mb"></div><div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn g" id="mc">Batal</button><button class="btn t">Simpan</button></div></form></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const KELAS=['1','2','3','4','5','6'];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const faseOf=k=>{k=parseInt(k);return k<=2?'A':k<=4?'B':k<=6?'C':''};
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const nm=(col,id,key='nama')=>(db[col].find(x=>x.id===id)||{})[key]||'-';

/* ===== penyimpanan lokal (offline-first) ===== */
const KEY='kelasku3d.v1';
const DEF={guru:{nama:'',nip:'',sekolah:'',npsn:'',kelas:'',tahun:'2026/2027',semester:'Ganjil',kepsek:'',nipKepsek:''},siswa:[],mapel:[],rpp:[],asesmen:[],jadwal:[],absensi:{},nilai:[],jurnal:[],catatan:{},karakter:{},projek:[],kalender:[],tl:{},instrumen:[],dini:{},diff:[],bahan:[],stem:[],modul:[],arsip:[],rapor:{},perangkat:[],soal:[],setting:{api:'/api/generate',kktp:70}};
let db=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(structuredClone(DEF),s)}catch{return structuredClone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Penyimpanan penuh / diblokir browser')}schedAuto();schedSync()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}

/* ===== modul CRUD generik ===== */
const MODS={
siswa:{label:'Data Siswa',col:'siswa',icon:'🧒',fields:[{k:'nis',l:'NIS / NISN'},{k:'nama',l:'Nama Lengkap',req:1},{k:'jk',l:'Jenis Kelamin',t:'select',o:['L','P'],req:1},{k:'ortu',l:'Nama Orang Tua / Wali'}],
  title:r=>r.nama,sub:r=>`NIS ${r.nis||'-'} • ${r.jk==='L'?'Laki-laki':r.jk==='P'?'Perempuan':'L/P belum diisi'}${r.ortu?' • Wali: '+r.ortu:''}`,sort:(a,b)=>a.nama.localeCompare(b.nama)},
mapel:{label:'Mata Pelajaran',col:'mapel',icon:'📚',fields:[{k:'nama',l:'Nama Mata Pelajaran',req:1},{k:'kelas',l:'Kelas',t:'select',o:KELAS},{k:'jp',l:'Jam Pelajaran / Minggu',t:'number',min:0,max:40}],
  title:r=>r.nama,sub:r=>`Kelas ${r.kelas||'-'} • Fase ${faseOf(r.kelas)||'-'} • ${r.jp||0} JP/minggu`,extra:`<button class="btn a" data-act="preset">⚡ Isi Mapel SD</button>`},
asesmen:{label:'Rencana Asesmen',col:'asesmen',icon:'📝',fields:[{k:'judul',l:'Judul Asesmen',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama'},{k:'jenis',l:'Jenis',t:'select',o:['Diagnostik','Formatif','Sumatif']},{k:'tanggal',l:'Tanggal',t:'date'},{k:'teknik',l:'Teknik / Instrumen'},{k:'tujuan',l:'Tujuan / Catatan',t:'textarea'}],
  title:r=>r.judul,sub:r=>`${r.jenis||'-'} • ${nm('mapel',r.mapel)} • ${fmtD(r.tanggal)}`,body:r=>[r.teknik,r.tujuan].filter(Boolean).join('\n'),sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')},
jadwal:{label:'Jadwal Kelas',col:'jadwal',icon:'🗓️',fields:[{k:'hari',l:'Hari',t:'select',o:HARI.slice(1,7),req:1},{k:'mulai',l:'Jam Mulai',t:'time',req:1},{k:'selesai',l:'Jam Selesai',t:'time',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama',req:1}],
  title:r=>nm('mapel',r.mapel),sub:r=>`${r.hari} • ${r.mulai}–${r.selesai}`,sort:(a,b)=>HARI.indexOf(a.hari)-HARI.indexOf(b.hari)||(a.mulai||'').localeCompare(b.mulai||'')},
nilai:{label:'Nilai Siswa',col:'nilai',icon:'🏅',fields:[{k:'siswa',l:'Siswa',t:'select',ref:'siswa',rl:'nama',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama',req:1},{k:'jenis',l:'Jenis Nilai',t:'select',o:['Harian','Tugas','Proyek','UTS','UAS']},{k:'tp',l:'Materi / Tujuan Pembelajaran (untuk deskripsi rapor)'},{k:'nilai',l:'Nilai (0–100)',t:'number',min:0,max:100,req:1},{k:'tanggal',l:'Tanggal',t:'date',d:'today'}],
  title:r=>`${nm('siswa',r.siswa)} — ${r.nilai}`,sub:r=>`${nm('mapel',r.mapel)} • ${r.jenis||'-'} • ${fmtD(r.tanggal)}${r.tp?' • '+r.tp:''}`,sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')},
jurnal:{label:'Jurnal Mengajar',col:'jurnal',icon:'📖',fields:[{k:'tanggal',l:'Tanggal',t:'date',d:'today',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama'},{k:'materi',l:'Materi',t:'textarea',req:1},{k:'kegiatan',l:'Kegiatan Pembelajaran',t:'textarea'},{k:'refleksi',l:'Refleksi / Tindak Lanjut',t:'textarea'}],
  title:r=>`${fmtD(r.tanggal)} • ${nm('mapel',r.mapel)}`,sub:r=>r.materi,body:r=>r.refleksi?'Refleksi: '+r.refleksi:'',sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')}
};
function fieldHtml(f,val){
  const req=f.req?'required':'';
  if(f.t==='select'){
    const o=f.ref?db[f.ref].map(r=>[r.id,r[f.rl]]):f.o.map(x=>[x,x]);
    const warn=f.ref&&!o.length?`<small>⚠ Isi menu terkait dulu (${f.l}).</small>`:'';
    return `<label>${f.l}</label><select name="${f.k}" ${req}><option value="">— pilih —</option>${o.map(([v,l])=>`<option value="${esc(v)}" ${v==val?'selected':''}>${esc(l)}</option>`).join('')}</select>${warn}`;
  }
  if(f.t==='textarea')return `<label>${f.l}</label><textarea name="${f.k}" ${req}>${esc(val)}</textarea>`;
  return `<label>${f.l}</label><input name="${f.k}" type="${f.t||'text'}" value="${esc(val)}" ${req} ${f.min!=null?`min="${f.min}" max="${f.max}"`:''}>`;
}
function openForm(key,id){
  const M=MODS[key],r=id?db[M.col].find(x=>x.id===id):null;
  $('#mt').textContent=(id?'Ubah ':'Tambah ')+M.label;
  $('#mb').innerHTML=M.fields.map(f=>fieldHtml(f,r?r[f.k]:(f.d==='today'?today():f.d||''))).join('');
  $('#mf').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o=r||{id:uid()};
    M.fields.forEach(f=>o[f.k]=f.t==='number'?(fd.get(f.k)===''?'':+fd.get(f.k)):fd.get(f.k));
    if(!r)db[M.col].push(o);save();$('#modal').classList.remove('on');toast('Tersimpan ✅');go()};
  $('#modal').classList.add('on');
}
function renderMod(v,key,q=''){
  const M=MODS[key];let rows=[...db[M.col]];if(M.sort)rows.sort(M.sort);
  if(q)rows=rows.filter(r=>(M.title(r)+' '+M.sub(r)+' '+(M.body?M.body(r):'')).toLowerCase().includes(q.toLowerCase()));
  v.innerHTML=`<div class="wrap"><div class="bar"><input id="q" type="search" placeholder="Cari ${M.label.toLowerCase()}…" value="${esc(q)}"><button class="btn t" data-act="add" data-k="${key}">＋ Tambah</button>${M.extra||''}</div>

async function readSource(f,mode){
  if(/^text\//.test(f.type)||/\.(txt|md|csv)$/i.test(f.name||''))return await f.text();
  if(f.size>8*1024*1024)throw new Error('Ukuran maksimal 8 MB');
  let data,type=f.type;
  if(/^image\//.test(f.type)){data=(await imgToJpeg(f)).split(',')[1];type='image/jpeg'}else data=await fileB64(f);
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),90000);
  try{
    const r=await fetch(apiBase('extract'),{method:'POST',headers:aiHdr(),body:JSON.stringify({name:f.name||'foto.jpg',type,data,mode}),signal:c.signal});
    const j=await r.json();if(!j.ok){const e=new Error(j.error||'gagal dibaca');e.srv=1;throw e}
    return j.text||'';
  }catch(e){if(e.srv)throw e;throw new Error(e.name==='AbortError'?'Waktu habis':'AI online belum tersambung — ketik atau tempel teks sumber manual')}
  finally{clearTimeout(tm)}
}

function addSources(files){

    srcPending.push(pr);

}
async function aiGen(btn){
  const d=rppEdit;if(!d.mapel||!d.topik){toast('Isi Mata Pelajaran dan Topik dulu ya');return}
  btn.disabled=true;btn.textContent='⏳ AI sedang menyusun…';
  if(srcPending.length){btn.textContent='⏳ Membaca berkas…';await Promise.allSettled(srcPending)}
  let data,src='ai';
  try{
    const c=new AbortController();const tm=setTimeout(()=>c.abort(),80000);
    const r=await fetch(db.setting.api||'/api/generate',{method:'POST',headers:aiHdr(),signal:c.signal,body:JSON.stringify({sekolah:db.guru.sekolah,mapel:d.mapel,kelas:d.kelas,fase:faseOf(d.kelas),semester:d.semester,topik:d.topik,tp:d.tp,alokasi:d.alokasi,sumber:d.sumber,sumber_teks:(d.sumber_teks||'').slice(0,8000),dplAuto:d.dplAuto,catatan:d.catatan,dpl:d.dpl.map(n=>({n,nama:DPL[n-1]}))})});
    clearTimeout(tm);const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');data=j.data;
  }catch(e){if(d.dplAuto){d.dpl=autoDpl(d);d.dplSet=true}data=localRpp(d);src='local'}
  TXTKEYS.concat(['rubrik_judul','rubrik_tujuan']).forEach(k=>{if(data[k]&&!(k==='tp'&&d.tp))d[k]=norm(data[k])});
  if(src==='ai'&&d.dplAuto){const n=[...new Set((Array.isArray(data.dpl)?data.dpl:[]).map(x=>+(String(x).match(/[1-8]/)||[0])[0]).filter(x=>x>=1&&x<=8))].sort((a,b)=>a-b);d.dpl=n.length?n:autoDpl(d);d.dplSet=true}
  if(Array.isArray(data.rubrik)&&data.rubrik.length)d.rubrik=data.rubrik.map(r=>({i:norm(r.indikator??r.i),b:norm(r.baru_memulai??r.b),k:norm(r.berkembang??r.k),c:norm(r.cakap??r.c),m:norm(r.mahir??r.m)}));
  rppPage($('#view'));
  toast(src==='ai'?'RPP selesai disusun AI ✨':'AI online belum tersambung — memakai template offline');
}

let raporSid='';
function raporData(sid){
  return db.mapel.map(m=>{
    const ns=db.nilai.filter(n=>n.siswa===sid&&n.mapel===m.id&&n.nilai!==''&&n.nilai!=null);if(!ns.length)return null;
    const rata=Math.round(ns.reduce((a,n)=>a+ +n.nilai,0)/ns.length*10)/10,by={};
    ns.forEach(n=>{const k=(n.tp||'').trim();if(k)(by[k]=by[k]||[]).push(+n.nilai)});
    const arr=Object.entries(by).map(([tp,v])=>({tp,nilai:Math.round(v.reduce((a,b)=>a+b,0)/v.length)})).sort((a,b)=>b.nilai-a.nilai);
    return{id:m.id,nama:m.nama,rata,tertinggi:arr[0]||null,terendah:arr.length>1?arr[arr.length-1]:null}
  }).filter(Boolean)
}
function localRapor(s,data){
  const n=s.nama.trim().split(/\s+/)[0],k=kktp(),m={};
  data.forEach(d=>{
    const p=predikat(d.rata).toLowerCase();let t;
    if(d.tertinggi){
      t=`Ananda ${n} menunjukkan capaian ${p} pada mata pelajaran ${d.nama}, terutama dalam ${d.tertinggi.tp}.`;
      if(d.terendah)t+=d.terendah.nilai<k?` Ananda masih perlu bimbingan dan latihan lebih lanjut dalam ${d.terendah.tp}.`:` Ananda juga sudah baik dalam ${d.terendah.tp}.`;

    m[d.id]=t});
  const all=data.reduce((a,d)=>a+d.rata,0)/data.length;
  return{m,wali:`Ananda ${n} menunjukkan perkembangan belajar yang ${all>=80?'sangat baik':all>=kktp()?'baik':'perlu terus didampingi'}. Dukungan belajar di rumah akan membantu ananda semakin percaya diri.`};
}

let gTok=null,gExp=0;
function gAuth(){return new Promise((res,rej)=>{
  if(gTok&&Date.now()<gExp)return res(gTok);
  const id=(db.setting.gClientId||'').trim();if(!id)return rej(new Error('Isi Google Client ID dulu'));
  if(!/^https?:/.test(location.protocol))return rej(new Error('Buka aplikasi dari alamat Cloudflare Anda (workers.dev) untuk memakai Drive'));
  const go=()=>{try{google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)rej(new Error('Izin Google ditolak'));else{gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;res(gTok)}},error_callback:()=>rej(new Error('Jendela izin Google ditutup'))}).requestAccessToken()}catch(e){rej(e)}};
  if(window.google&&google.accounts&&google.accounts.oauth2)go();else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=()=>rej(new Error('Tidak ada koneksi internet'));document.head.appendChild(s)}})}
const gH=t=>({Authorization:'Bearer '+t});
async function driveFind(t){const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+encodeURIComponent("name='kelasku-backup.json'")+"&fields=files(id,modifiedTime)",{headers:gH(t)});if(!r.ok)throw new Error('Drive '+r.status+(r.status===403?' (aktifkan Google Drive API)':''));return(await r.json()).files||[]}
async function driveUp(){
  const t=await gAuth(),f=(await driveFind(t))[0],meta={name:'kelasku-backup.json'};if(!f)meta.parents=['appDataFolder'];
  const bd='kk'+uid(),mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(db)}\r\n--${bd}--`;
  const r=await fetch(f?`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:f?'PATCH':'POST',headers:{...gH(t),'content-type':'multipart/related; boundary='+bd},body:mp});
  if(!r.ok)throw new Error('Drive '+r.status);markBackup()
}
async function driveDown(){
  const t=await gAuth(),f=(await driveFind(t))[0];if(!f)throw new Error('Belum ada cadangan di Drive');
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:gH(t)});if(!r.ok)throw new Error('Drive '+r.status);
  const j=await r.json();if(!j||typeof j!=='object'||!j.guru)throw new Error('Isi cadangan tidak valid');
  if(!confirm('Ganti SEMUA data di perangkat ini dengan cadangan Drive?'))return false;
  const keep=db.setting;db=Object.assign(structuredClone(DEF),j);db.setting=Object.assign({},j.setting,{gClientId:keep.gClientId,api:keep.api||(j.setting&&j.setting.api)});save();ini();return true
}

let imp=null;
function delimRows(t){

}
const JKN=v=>{v=String(v||'').trim().toLowerCase();if(!v)return'';if(/^(l|lk|laki|laki-laki|laki laki|pria|m|male|cowok)$/.test(v))return'L';if(/^(p|pr|perempuan|wanita|f|female|cewek)$/.test(v))return'P';return''};
const fixNis=x=>{x=String(x||'').trim();if(/^\d+(\.\d+)?e\+?\d+$/i.test(x))x=Number(x).toFixed(0);return x.replace(/\.0+$/,'')};
function mapSiswa(rows){
  let hdr=-1,col={};
  for(let i=0;i<Math.min(6,rows.length)&&hdr<0;i++){const c={};
    rows[i].forEach((x,j)=>{const k=String(x).toLowerCase().replace(/[^a-z]/g,'');if(!k)return;
      if(/^(jk|lp|jeniskelamin|kelamin|gender|sex)$/.test(k))c.jk=j;
      else if(/^(hp|wa|whatsapp|telepon|telp|nohp|nomorhp|notelp|kontak)/.test(k))c.hp=j;
      else if(/ortu|orangtua|wali|ayah|ibu|bapak/.test(k))c.ortu=j;
      else if(/nama|^siswa$|^pesertadidik$/.test(k))c.nama=j;

    for(let j=0;j<nc;j++){const v=rows.map(r=>String(r[j]??'').trim()).filter(Boolean);st.push({n:v.length,jk:v.filter(x=>JKN(x)).length,num:v.filter(x=>/^\d{4,}$/.test(x)).length,al:v.filter(x=>/^[A-Za-z][A-Za-z .,'’\-]{4,}$/.test(x)).length})}

    st.forEach((s,j)=>{if(s.n>=2&&s.num/s.n>=0.8&&col.nis===undefined)col.nis=j});
    const names=st.map((s,j)=>[s,j]).filter(([s,j])=>j!==col.jk&&j!==col.nis&&s.n>=2&&s.al/s.n>=0.7).map(([,j])=>j);

  const list=[];
  data.forEach(r=>{const nama=String(r[col.nama]??'').replace(/\s+/g,' ').trim();if(!nama||/^\d+$/.test(nama)||/^(no|nama|jumlah|total)$/i.test(nama))return;

}

}

}

  const rows=sortSiswa().map(s=>{const t={H:0,S:0,I:0,A:0},per=ms.map(M=>{const r=M.rows.find(x=>x.s.id===s.id);if(r)for(const k in t)t[k]+=r.c[k];return r?r.pct:null});return{s,per,t,pct:eff?Math.round(t.H/eff*100):null}});

const dowOf=d=>new Date(d+'T00:00:00').getDay();
function absBulanHtml(ymv){

function legerData(){
  const M=db.mapel.filter(m=>db.nilai.some(n=>n.mapel===m.id&&n.nilai!==''&&n.nilai!=null)),S=sortSiswa();
  const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  const rows=S.map(s=>{const v=M.map(m=>av(db.nilai.filter(n=>n.siswa===s.id&&n.mapel===m.id&&n.nilai!==''&&n.nilai!=null).map(n=>+n.nilai)));const f=v.filter(x=>x!==null),jml=Math.round(f.reduce((a,b)=>a+b,0)*10)/10;return{s,v,jml,rata:f.length?Math.round(jml/f.length*10)/10:null}});
  const rs=rows.filter(r=>r.rata!==null).map(r=>r.rata).sort((a,b)=>b-a);rows.forEach(r=>r.rank=r.rata===null?'':rs.indexOf(r.rata)+1);
  const col=M.map((m,j)=>{const x=rows.map(r=>r.v[j]).filter(z=>z!==null);return{rata:av(x),max:x.length?Math.max(...x):null,min:x.length?Math.min(...x):null,tuntas:x.length?Math.round(x.filter(z=>z>=kktp()).length/x.length*100):null}});
  return{M,rows,col,rataKelas:av(rows.filter(r=>r.rata!==null).map(r=>r.rata))}
}
function legerHtml(){
  const L=legerData(),k=kktp(),cell=x=>x==null?'-':(x<k?`<span style="color:#c9304c;font-weight:700">${x}*</span>`:x);
  if(!L.M.length||!L.rows.length)return '<div class="empty"><b>🏅</b>Isi Data Siswa, Mata Pelajaran, dan Nilai Siswa dulu.</div>';
  const head=`<tr><th>No</th><th>Nama</th>${L.M.map(m=>`<th>${esc(m.nama)}</th>`).join('')}<th>Jumlah</th><th>Rata-rata</th>${legerRank?'<th>Peringkat</th>':''}</tr>`;
  const body=L.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.s.nama)}</td>${r.v.map(x=>`<td>${cell(x)}</td>`).join('')}<td>${r.rata==null?'-':r.jml}</td><td><b>${r.rata==null?'-':r.rata}</b></td>${legerRank?`<td>${r.rank}</td>`:''}</tr>`).join('');
  const tail=(lab,f,extra)=>`<tr style="background:#f4f1ff"><td colspan="2"><b>${lab}</b></td>${L.col.map(c=>`<td>${c[f]==null?'-':c[f]}</td>`).join('')}<td></td><td>${extra==null?'':extra}</td>${legerRank?'<td></td>':''}</tr>`;
  return `<table class="cmp"><thead>${head}</thead><tbody>${body}${tail('Rata-rata kelas','rata',L.rataKelas)}${tail('Tertinggi','max')}${tail('Terendah','min')}${tail('Ketuntasan (%)','tuntas')}</tbody></table><p style="font-size:11px;margin-top:6px">* di bawah batas ketuntasan (KKTP ${k}). Nilai = rata-rata seluruh nilai pada mata pelajaran tersebut.</p>`
}

const JC={'Libur':'#ff4d6d','Asesmen/Ujian':'#ffb020','Pembagian Rapor':'#00b8a0','Rapat/Pertemuan':'#3b82f6','Administrasi/Tenggat':'#6d4aff','Kegiatan Sekolah':'#16a34a','Lainnya':'#6a6f8f'};
const INGAT=['Tanpa pengingat','Pada hari H','1 hari sebelumnya','3 hari sebelumnya','7 hari sebelumnya'];
const ingatN=v=>{const i=INGAT.indexOf(v);return i<=0?null:[null,0,1,3,7][i]};
const evEnd=e=>e.selesai&&e.selesai>=e.tanggal?e.selesai:e.tanggal;

  title:r=>r.judul,sub:r=>fmtD(r.tanggal)+(r.selesai&&r.selesai>r.tanggal?' – '+fmtD(r.selesai):''),sort:(a,b)=>a.tanggal.localeCompare(b.tanggal)};
function remItems(){const t=today();return db.kalender.map(e=>({e,du:daysTo(e.tanggal),on:e.tanggal<=t&&t<=evEnd(e)})).filter(x=>x.on||(x.du>0&&x.du<=14)).sort((a,b)=>(a.on?-1:a.du)-(b.on?-1:b.du)).slice(0,6)}

function makeIcs(list){
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KelasKu//ID','CALSCALE:GREGORIAN','X-WR-CALNAME:KelasKu'];
  list.forEach(e=>{
    L.push('BEGIN:VEVENT',`UID:${e.id}@kelasku`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${e.tanggal.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(evEnd(e),1).replace(/-/g,'')}`,`SUMMARY:${esc2(e.judul)}`);
    if(e.catatan||e.jenis)L.push(`DESCRIPTION:${esc2([e.jenis,e.catatan].filter(Boolean).join(' — '))}`);
    const n=ingatN(e.ingat);if(n!==null)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2(e.judul)}`,`TRIGGER:${n===0?'PT7H':n===1?'-PT17H':`-P${n-1}DT17H`}`,'END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')
}

/* ---------- 1. TINDAK LANJUT NILAI (remedial & pengayaan) ---------- */
let tlM='';
const tlKey=(mid,tp)=>mid+'|'+tp;
function tlData(mid){
  const S=sortSiswa(),N=db.nilai.filter(n=>n.mapel===mid&&n.nilai!==''&&n.nilai!=null&&db.siswa.some(s=>s.id===n.siswa)),k=kktp();
  const mk=(label,tp,f)=>{
    const per=S.map(s=>{const v=N.filter(n=>n.siswa===s.id&&f(n)).map(n=>+n.nilai);return v.length?{s,avg:Math.round(v.reduce((a,b)=>a+b,0)/v.length)}:null}).filter(Boolean);
    return{label,tp,total:per.length,rem:per.filter(x=>x.avg<k),ayn:per.filter(x=>x.avg>=90),tuntas:per.filter(x=>x.avg>=k).length}};
  const tps=[...new Set(N.map(n=>(n.tp||'').trim()).filter(Boolean))];
  return[mk('Keseluruhan nilai','',()=>true),...tps.map(t=>mk(t,t,n=>(n.tp||'').trim()===t))].filter(g=>g.total)
}
function localTl(tp){
  const t=tp?` pada materi “${tp}”`:'';
  return{rem:{kegiatan:[`Pembelajaran ulang${t} dengan alat peraga atau benda konkret dalam kelompok kecil.`,'Tutor sebaya: siswa yang sudah tuntas mendampingi temannya.','Latihan bertahap dari mudah ke sulit disertai umpan balik langsung.','Asesmen ulang singkat setelah pendampingan.'],soal:[]},
    ayn:{kegiatan:[`Soal tantangan tingkat lanjut${t} yang menuntut penalaran.`,'Menjadi tutor sebaya bagi teman yang belum tuntas.','Membuat proyek mini atau penjelasan sederhana yang mengaitkan materi dengan kehidupan sehari-hari.'],soal:[]},ai:false}
}
const planList=(a,o)=>a.length?`<ol style="margin:4px 0 8px 20px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';

  <b>Rencana Pengayaan</b>${planList(p.ayn.kegiatan)}${p.ayn.soal.length?`<small class="mut">Soal tantangan:</small>${planList(p.ayn.soal)}`:''}</div>`
}

  const m=db.mapel.find(x=>x.id===mid)||{},p=db.tl[tlKey(mid,g.tp)];
  const lst=a=>a.length?`<ol style="margin-left:20px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p>-</p>';

   +`<p>Mata pelajaran: <b>${esc(m.nama||'-')}</b> • Kelas ${esc(db.guru.kelas||'-')}<br>Materi / TP: <b>${esc(g.label)}</b> • KKTP ${kktp()} • Tuntas ${g.tuntas} dari ${g.total} siswa</p>`
   +`<p style="margin-top:8px"><b>A. Remedial</b></p>`+dtab(['No','Nama','Nilai'],g.rem.map((x,i)=>[i+1,x.s.nama,x.avg]))
   +`<p style="margin-top:8px"><b>B. Pengayaan</b></p>`+dtab(['No','Nama','Nilai'],g.ayn.map((x,i)=>[i+1,x.s.nama,x.avg]))
   +(p?`<p style="margin-top:8px"><b>C. Rencana Kegiatan Remedial</b></p>${lst(p.rem.kegiatan)}${p.rem.soal.length?`<p>Soal latihan:</p>${lst(p.rem.soal)}`:''}<p><b>D. Rencana Kegiatan Pengayaan</b></p>${lst(p.ayn.kegiatan)}${p.ayn.soal.length?`<p>Soal tantangan:</p>${lst(p.ayn.soal)}`:''}`:'')
}

  if(j==='remedial'){

}

const hdrKey=x=>String(x??'').toLowerCase().replace(/[^a-z]/g,'');
const NORMN=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const cl=x=>String(x??'').trim();
const mdRows=t=>{const L=String(t).split(/\r?\n/).filter(l=>l.includes('|'));const rows=L.filter(l=>!/^[\s|:\-]+$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.replace(/<br\s*\/?>/gi,' ').trim()));return rows.length>=2?rows:null};
const xlDate=n=>{n=+n;if(!(n>20000&&n<80000))return'';return new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5).toISOString().slice(0,10)};
const BLN={januari:1,jan:1,februari:2,feb:2,pebruari:2,maret:3,mar:3,april:4,apr:4,mei:5,juni:6,jun:6,juli:7,jul:7,agustus:8,agu:8,agt:8,ags:8,september:9,sep:9,sept:9,oktober:10,okt:10,november:11,nov:11,nopember:11,desember:12,des:12};
function dateOf(x){
  x=cl(x);if(!x)return'';
  let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){const s=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;return validD(s)?s:''}
  m=x.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;const s=`${y}-${pad(m[2])}-${pad(m[1])}`;return validD(s)?s:''}
  m=x.toLowerCase().match(/^(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})$/);
  if(m&&BLN[m[2]]){const s=`${m[3]}-${pad(BLN[m[2]])}-${pad(m[1])}`;return validD(s)?s:''}
  if(/^\d+(\.\d+)?$/.test(x))return xlDate(x);
  return''
}
function timeOf(x){
  x=cl(x);if(!x)return'';
  if(/^\d*\.\d+$/.test(x)&&+x<1){const mn=Math.round(+x*1440);return pad(Math.floor(mn/60))+':'+pad(mn%60)}
  let m=x.match(/^(\d{1,2})[.:](\d{2})/);if(m&&+m[1]<24&&+m[2]<60)return pad(m[1])+':'+pad(m[2]);
  m=x.match(/^(\d{1,2})$/);if(m&&+m[1]<24)return pad(m[1])+':00';
  return''
}
const hariOf=x=>{const k=hdrKey(x);if(k.length<3)return'';return HARI.slice(1,7).find(h=>hdrKey(h).slice(0,3)===k.slice(0,3))||''};
const stOf=v=>{const k=hdrKey(v);if(!k)return/^[✓√•.]$/.test(cl(v))?'H':'';if(/^(h|hadir|masuk|v|p|present)$/.test(k))return'H';if(/^(s|sakit|sick)$/.test(k))return'S';if(/^(i|izin|ijin|permisi)$/.test(k))return'I';if(/^(a|alpa|alfa|alpha|tanpaketerangan|absen)$/.test(k))return'A';return''};
function findHdr(rows,spec,need){
  for(let i=0;i<Math.min(8,rows.length);i++){const c={};
    rows[i].forEach((x,j)=>{const k=hdrKey(x);if(!k)return;for(const f in spec){if(c[f]===undefined&&spec[f].test(k)){c[f]=j;break}}});
    if(need.every(f=>c[f]!==undefined))return{i,c}}
  return null
}
const RANGE=/\s*(?:-|–|—|s\/d|s\.d\.|sd)\s*/i;
const BUILD={
  siswa:rows=>{const M=mapSiswa(rows);return M?M.list:null},
  mapel:rows=>{
    const H=findHdr(rows,{kelas:/^kelas$/,jp:/^(jp|jampelajaran|jam|alokasi|jpminggu)/,nama:/(mapel|pelajaran|^nama)/},['nama']);
    if(H)return rows.slice(H.i+1).map(r=>({nama:cl(r[H.c.nama]),kelas:H.c.kelas!==undefined?cl(r[H.c.kelas]).replace(/\D/g,''):'',jp:H.c.jp!==undefined?(+cl(r[H.c.jp]).replace(/\D/g,'')||0):0})).filter(x=>x.nama);
    return rows.map(r=>({nama:cl(r[0]),kelas:'',jp:0})).filter(x=>x.nama&&!/^\d+$/.test(x.nama))},
  jadwal:rows=>{
    const H=findHdr(rows,{hari:/^hari$/,mulai:/^(mulai|jammulai|dari|awal)/,selesai:/^(selesai|jamselesai|sampai|akhir)/,jam:/^(jam|waktu|pukul)$/,mapel:/(mapel|pelajaran)/},['hari','mapel']);
    if(!H)return null;
    return rows.slice(H.i+1).map(r=>{let a='',b='';
      if(H.c.mulai!==undefined){a=timeOf(r[H.c.mulai]);b=H.c.selesai!==undefined?timeOf(r[H.c.selesai]):''}
      else if(H.c.jam!==undefined){const p=cl(r[H.c.jam]).split(RANGE);a=timeOf(p[0]);b=timeOf(p[1])}
      return{hari:hariOf(r[H.c.hari]),mulai:a,selesai:b,mapel:cl(r[H.c.mapel])}}).filter(x=>x.hari||x.mapel)},
  nilai:rows=>{
    const H=findHdr(rows,{nama:/(^nama|siswa|pesertadidik)/,mapel:/^(mapel|matapelajaran|pelajaran)$/,nilai:/^(nilai|skor|angka|hasil)$/,jenis:/^(jenis|jenisnilai|penilaian)$/,tp:/^(tp|materi|tujuan|tujuanpembelajaran|topik)/,tgl:/^(tanggal|tgl)$/},['nama']);
    if(!H)return null;const C=H.c,data=rows.slice(H.i+1);
    if(C.nilai!==undefined)return data.map(r=>({nama:cl(r[C.nama]),mapel:C.mapel!==undefined?cl(r[C.mapel]):'',nilai:cl(r[C.nilai]),jenis:C.jenis!==undefined?cl(r[C.jenis]):'',tp:C.tp!==undefined?cl(r[C.tp]):'',tanggal:C.tgl!==undefined?dateOf(r[C.tgl]):''})).filter(x=>x.nama);
    const skip=/^(no|nis|nisn|nama|namasiswa|jk|lp|jeniskelamin|jumlah|total|rata|ratarata|rerata|peringkat|rank|ket|keterangan|namapesertadidik)$/;
    const cols=rows[H.i].map((x,j)=>[cl(x),j]).filter(([h,j])=>h&&j!==C.nama&&!skip.test(hdrKey(h)));
    const out=[];data.forEach(r=>{const nama=cl(r[C.nama]);if(!nama||/^(rata|jumlah|total)/i.test(nama))return;cols.forEach(([h,j])=>{const v=cl(r[j]);if(v!=='')out.push({nama,mapel:h,nilai:v,jenis:'',tp:'',tanggal:''})})});
    return out},
  absensi:rows=>{
    const H=findHdr(rows,{nama:/(^nama|siswa|pesertadidik)/,tgl:/^(tanggal|tgl)$/,st:/^(status|ket|keterangan|kehadiran|absen)$/},['nama']);
    if(!H)return null;const C=H.c;
    if(C.tgl!==undefined&&C.st!==undefined)return rows.slice(H.i+1).map(r=>({nama:cl(r[C.nama]),tanggal:dateOf(r[C.tgl]),status:cl(r[C.st])})).filter(x=>x.nama);
    const [y,m]=ipS.bulan.split('-').map(Number),out=[];
    const dc=rows[H.i].map((x,j)=>[+cl(x),j]).filter(([d,j])=>Number.isInteger(d)&&d>=1&&d<=31&&j!==C.nama);
    rows.slice(H.i+1).forEach(r=>{const nama=cl(r[C.nama]);if(!nama)return;dc.forEach(([d,j])=>{const v=cl(r[j]);if(v)out.push({nama,tanggal:`${y}-${pad(m)}-${pad(d)}`,status:v})})});
    return out},
  asesmen:rows=>{
    const H=findHdr(rows,{jenis:/^jenis/,mapel:/(mapel|pelajaran)/,tgl:/^(tanggal|tgl|waktu)$/,teknik:/(teknik|instrumen|bentuk)/,judul:/(judul|asesmen|nama|kegiatan)/},['judul']);
    if(!H)return null;const C=H.c;
    return rows.slice(H.i+1).map(r=>({judul:cl(r[C.judul]),mapel:C.mapel!==undefined?cl(r[C.mapel]):'',jenis:C.jenis!==undefined?cl(r[C.jenis]):'',tanggal:C.tgl!==undefined?dateOf(r[C.tgl]):'',teknik:C.teknik!==undefined?cl(r[C.teknik]):''})).filter(x=>x.judul)}
};

function mapelRes(name){const n=NORMN(name);if(!n)return null;const m=db.mapel.find(x=>NORMN(x.nama)===n);return m?{id:m.id,nama:m.nama}:{id:null,nama:cl(name),isNew:true}}
function siswaRes(name){const n=NORMN(name);if(!n)return null;let c=db.siswa.filter(s=>NORMN(s.nama)===n);if(c.length===1)return c[0];if(c.length>1)return null;c=db.siswa.filter(s=>{const t=NORMN(s.nama);return t&&(t.startsWith(n+' ')||n.startsWith(t+' '))});return c.length===1?c[0]:null}
function ipFinal(type,recs){
  const seen=new Set(),out=[],bad=(rec,cols,note)=>out.push({rec,cols,st:'bad',note}),mk=(rec,cols,dup,note)=>out.push({rec,cols,st:dup?'dup':'ok',note:note||''});
  if(type==='siswa'){
    const L=recs.filter(x=>x.nama);impDup(L);
    L.forEach(x=>mk({nis:x.nis,nama:x.nama,jk:x.jk,ortu:x.ortu,hp:x.hp||''},[x.nama,x.nis,x.jk||'?',x.ortu,x.hp||''],x.dup))
  }else recs.forEach(r=>{
    if(type==='mapel'){const k=NORMN(r.nama),kl=KELAS.includes(String(r.kelas))?String(r.kelas):(db.guru.kelas||'');
      if(!k)return bad(null,['','',''],'nama kosong');const dup=db.mapel.some(m=>NORMN(m.nama)===k&&(!r.kelas||String(m.kelas)===kl))||seen.has(k);seen.add(k);
      return mk({nama:cl(r.nama),kelas:kl,jp:+r.jp||0},[r.nama,kl,r.jp||0],dup)}
    if(type==='jadwal'){const rm=mapelRes(r.mapel);
      if(!r.hari||!r.mulai||!r.selesai||!rm)return bad(null,[r.hari||'?',r.mulai||'?',r.selesai||'?',r.mapel||'?'],'hari/jam/mapel belum lengkap');
      const key=[r.hari,r.mulai,NORMN(rm.nama)].join('|'),dup=db.jadwal.some(j=>j.hari===r.hari&&j.mulai===r.mulai&&rm.id&&j.mapel===rm.id)||seen.has(key);seen.add(key);
      return mk({hari:r.hari,mulai:r.mulai,selesai:r.selesai,_m:rm},[r.hari,r.mulai,r.selesai,rm.nama+(rm.isNew?' (baru)':'')],dup)}
    if(type==='nilai'){const s=siswaRes(r.nama),mn=r.mapel||(db.mapel.find(m=>m.id===ipS.mapelSel)||{}).nama,rm=mapelRes(mn),v=+String(r.nilai).replace(',','.');
      const nm_=s?s.nama:r.nama,mc=rm?rm.nama+(rm.isNew?' (baru)':''):'?';
      if(!s)return bad(null,[nm_,mc,'','',''],'siswa tidak ditemukan di Data Siswa');
      if(!rm)return bad(null,[nm_,'?','','',''],'mata pelajaran belum dipilih');
      if(cl(r.nilai)===''||!isFinite(v)||v<0||v>100)return bad(null,[nm_,mc,'',r.nilai,''],'nilai harus angka 0–100');
      const jn=['Harian','Tugas','Proyek','UTS','UAS'].find(j=>j.toLowerCase()===cl(r.jenis).toLowerCase())||ipS.jenis,tg=r.tanggal||ipS.tgl,tp=cl(r.tp)||cl(ipS.tp);
      const dup=rm.id&&db.nilai.some(n=>n.siswa===s.id&&n.mapel===rm.id&&n.jenis===jn&&n.tanggal===tg&&(n.tp||'')===tp)||seen.has([s.id,NORMN(rm.nama),jn,tg,tp].join('|'));seen.add([s.id,NORMN(rm.nama),jn,tg,tp].join('|'));
      return mk({_s:s.id,_m:rm,jenis:jn,tanggal:tg,tp,nilai:v},[s.nama,mc,jn,v,tp||'-'],dup)}
    if(type==='absensi'){const s=siswaRes(r.nama),st=stOf(r.status),tg=dateOf(r.tanggal);
      if(!s)return bad(null,[r.nama,tg||'?',r.status],'siswa tidak ditemukan di Data Siswa');
      if(!tg)return bad(null,[s.nama,'?',r.status],'tanggal tidak valid');
      if(!st)return bad(null,[s.nama,tg,r.status],'status bukan H/S/I/A');
      const was=(db.absensi[tg]||{})[s.id],key=s.id+tg,dup=was===st||seen.has(key);seen.add(key);
      return mk({_s:s.id,tanggal:tg,status:st},[s.nama,fmtD(tg),st],dup,was&&was!==st?'menimpa '+was:'')}
    if(type==='asesmen'){if(!cl(r.judul))return;const rm=r.mapel?mapelRes(r.mapel):null,jn=['Diagnostik','Formatif','Sumatif'].find(j=>j.toLowerCase()===cl(r.jenis).toLowerCase())||'',tg=dateOf(r.tanggal);
      const dup=db.asesmen.some(a=>NORMN(a.judul)===NORMN(r.judul)&&(a.tanggal||'')===tg)||seen.has(NORMN(r.judul)+tg);seen.add(NORMN(r.judul)+tg);
      return mk({judul:cl(r.judul),_m:rm,jenis:jn,tanggal:tg,teknik:cl(r.teknik)},[r.judul,rm?rm.nama:'-',jn||'-',tg?fmtD(tg):'-'],dup)}
  });
  return out
}
function ipRefresh(){if(ipS.rows){const r=ipBuild(ipS.rows);if(r)ipS.recs=r}ipS.items=ipS.recs?ipFinal(ipS.type,ipS.recs):null}
function fromAI(type,L){
  return asArr(L).map(x=>{x=x||{};const s=k=>cl(norm(x[k]));
    if(type==='siswa')return{nama:s('nama'),nis:fixNis(s('nis')),jk:JKN(s('jk')),ortu:s('ortu'),hp:s('hp')};
    if(type==='mapel')return{nama:s('nama'),kelas:s('kelas').replace(/\D/g,''),jp:+s('jp').replace(/\D/g,'')||0};
    if(type==='jadwal')return{hari:hariOf(s('hari')),mulai:timeOf(s('mulai')),selesai:timeOf(s('selesai')),mapel:s('mapel')};
    if(type==='nilai')return{nama:s('nama'),mapel:s('mapel'),nilai:s('nilai'),jenis:s('jenis'),tp:s('tp'),tanggal:dateOf(s('tanggal'))};
    if(type==='absensi')return{nama:s('nama'),tanggal:dateOf(s('tanggal')),status:s('status')};
    return{judul:s('judul'),mapel:s('mapel'),jenis:s('jenis'),tanggal:dateOf(s('tanggal')),teknik:s('teknik')}})
}
async function ipAI(text){
  ipS.note='Dibaca AI — periksa hasilnya sebelum mengimpor';
  const r=await tugas('impor',{tipe:ipS.type,teks:String(text).slice(0,7000),mapel:db.mapel.map(m=>m.nama).slice(0,30),bulan:ipS.bulan},90000);
  const recs=fromAI(ipS.type,r&&r.rows).filter(x=>Object.values(x).some(Boolean));
  if(!recs.length)throw new Error('AI tidak menemukan data pada berkas ini');
  ipS.rows=null;ipS.recs=recs;ipRefresh()
}
async function ipRows(rows,text,ocr){
  ipS.rows=rows;const r=ipBuild(rows);
  if(r){ipS.recs=r;ipS.note=ocr?'Tabel terbaca dari berkas — periksa hasilnya':'';ipRefresh();return}
  await ipAI(text||rows.map(x=>x.join('\t')).join('\n'))
}
async function ipText(text,ocr){
  text=String(text||'');if(text.trim().length<3)throw new Error('Tidak ada teks yang terbaca');
  const md=mdRows(text);
  if(md)return ipRows(md,text,ocr);
  if(!ocr)return ipRows(delimRows(text),text,false);
  return ipAI(text)
}
async function ipFiles(fs){
  if(!fs.length)return;
  try{
    const f0=fs[0],nmf=(f0.name||'').toLowerCase();
    if(fs.length===1&&/\.xlsx$/.test(nmf)){toast('⏳ Membaca Excel…');const rows=await xlsxRows(await f0.arrayBuffer());await ipRows(rows,'',false)}
    else if(fs.length===1&&/\.xls$/.test(nmf))throw new Error('Format .xls lama belum didukung. Simpan ulang sebagai .xlsx atau .csv.');
    else if(fs.length===1&&/\.(csv|tsv|txt)$/.test(nmf))await ipText(await f0.text(),false);
    else if(fs.length===1&&/\.html?$/.test(nmf))await ipRows(htmlRows(await f0.text()),'',false);
    else{let all='',i=0;for(const f of fs){toast(`⏳ Membaca ${++i}/${fs.length}… (AI)`);all+=(all?'\n':'')+await readSource(f)}await ipText(all,true)}
    toast('Berkas terbaca — periksa pratinjau')
  }catch(e){toast(String(e.message||e).slice(0,110))}
  go()
}

function ipCommit(){
  const cache={},getM=rm=>{if(!rm)return'';if(rm.id)return rm.id;const k=NORMN(rm.nama);if(!cache[k]){const m={id:uid(),nama:rm.nama,kelas:db.guru.kelas||'',jp:0};db.mapel.push(m);cache[k]=m.id}return cache[k]};
  const L=ipS.items.filter(x=>x.st==='ok');
  L.forEach(({rec:r})=>{
    if(ipS.type==='siswa')db.siswa.push({id:uid(),nis:r.nis,nama:r.nama,jk:r.jk,ortu:r.ortu,hp:r.hp});
    else if(ipS.type==='mapel')db.mapel.push({id:uid(),nama:r.nama,kelas:r.kelas,jp:r.jp});
    else if(ipS.type==='jadwal')db.jadwal.push({id:uid(),hari:r.hari,mulai:r.mulai,selesai:r.selesai,mapel:getM(r._m)});
    else if(ipS.type==='nilai')db.nilai.push({id:uid(),siswa:r._s,mapel:getM(r._m),jenis:r.jenis,tp:r.tp,nilai:r.nilai,tanggal:r.tanggal});
    else if(ipS.type==='absensi'){const d=db.absensi[r.tanggal]=db.absensi[r.tanggal]||{};d[r._s]=r.status}
    else db.asesmen.push({id:uid(),judul:r.judul,mapel:r._m?getM(r._m):'',jenis:r.jenis,tanggal:r.tanggal,teknik:r.teknik,tujuan:''})});
  save();return L.length
}

let micRec=null;
function micStart(btn,onText){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Perekam suara belum didukung browser ini. Pakai ikon 🎤 pada keyboard HP.');return}
  if(micRec){try{micRec.stop()}catch(e){}return}
  const r=new SR(),lbl=btn.textContent;r.lang='id-ID';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';t=t.trim();if(t)onText(t)};
  r.onerror=e=>toast(e.error==='not-allowed'?'Izin mikrofon ditolak — aktifkan di pengaturan browser':'Suara tidak terbaca ('+e.error+')');
  r.onend=()=>{micRec=null;btn.textContent=lbl};
  micRec=r;btn.textContent='⏹ Berhenti';try{r.start()}catch(e){micRec=null;btn.textContent=lbl}
}

    const r=D.rows.find(x=>x.s.id===s.id)||{t:{H:0,S:0,I:0,A:0},pct:null},nl=raporData(s.id).map(d=>`${d.nama} ${d.rata}`).join(', ')||'-',kd=KG(s.id).dim,
      kk=DPL.map((n,i)=>kd[i+1]?`${n.split(' ')[0]}:${LVN[kd[i+1]]}`:'').filter(Boolean).join(', ');
    return `${s.nama}(${s.jk||'?'}) hadir ${r.t.H}, sakit ${r.t.S}, izin ${r.t.I}, alpa ${r.t.A}${r.pct!=null?' ('+r.pct+'%)':''} | nilai: ${nl}${kk?' | karakter: '+kk:''}`});
  const ev=db.kalender.filter(e=>evEnd(e)>=today()).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).slice(0,5).map(e=>`${e.tanggal} ${e.judul}`);
  return `Kelas ${g.kelas||'-'}, TA ${g.tahun} ${g.semester}, KKTP ${k}, ${S.length} siswa, hari efektif absensi semester ini ${D.eff}.\nSiswa (rekap semester):\n${L.join('\n')}${ev.length?'\nAgenda: '+ev.join('; '):''}`.slice(0,7000)
}
const QUICK=[['alpa','Siapa paling sering tidak hadir?'],['remedial','Siapa perlu remedial?'],['rata','Rata-rata kelas per mapel'],['top','5 nilai tertinggi'],['risiko','Siswa perlu perhatian khusus']];
function localQ(key){
  const S=sortSiswa(),D=absSem(),k=kktp();
  if(!S.length)return'Data siswa masih kosong.';
  const sr=s=>D.rows.find(x=>x.s.id===s.id)||{t:{H:0,S:0,I:0,A:0},pct:null},avgS=s=>{const n=raporData(s.id);return n.length?Math.round(n.reduce((a,x)=>a+x.rata,0)/n.length*10)/10:null};
  if(key==='alpa'){
    if(!D.eff)return'Belum ada absensi tercatat pada semester ini.';
    const L=S.map(s=>({s,t:sr(s).t,pct:sr(s).pct})).filter(x=>x.t.A+x.t.S+x.t.I>0).sort((a,b)=>b.t.A-a.t.A||(b.t.S+b.t.I)-(a.t.S+a.t.I)).slice(0,5);
    return L.length?'Ketidakhadiran terbanyak semester ini:\n'+L.map((x,i)=>`${i+1}. ${x.s.nama} — Alpa ${x.t.A}, Sakit ${x.t.S}, Izin ${x.t.I} (hadir ${x.pct}%)`).join('\n'):'Semua siswa hadir penuh pada hari yang tercatat 🎉'}
  if(key==='remedial'){
    const out=db.mapel.map(m=>{const L=S.map(s=>{const d=raporData(s.id).find(x=>x.id===m.id);return d&&d.rata<k?`${s.nama} (${d.rata})`:null}).filter(Boolean);return L.length?`${m.nama}: ${L.join(', ')}`:null}).filter(Boolean);
    return out.length?`Siswa dengan rata-rata di bawah KKTP (${k}):\n`+out.join('\n'):`Tidak ada siswa di bawah KKTP (${k}) berdasarkan nilai yang tercatat.`}
  if(key==='rata'){
    const out=db.mapel.map(m=>{const v=S.map(s=>{const d=raporData(s.id).find(x=>x.id===m.id);return d?d.rata:null}).filter(x=>x!==null);return v.length?`${m.nama}: ${Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10} (tuntas ${Math.round(v.filter(x=>x>=k).length/v.length*100)}%)`:null}).filter(Boolean);
    return out.length?'Rata-rata kelas per mata pelajaran:\n'+out.join('\n'):'Belum ada nilai tercatat.'}
  if(key==='top'){
    const L=S.map(s=>({s,a:avgS(s)})).filter(x=>x.a!==null).sort((a,b)=>b.a-a.a).slice(0,5);
    return L.length?'Rata-rata nilai tertinggi:\n'+L.map((x,i)=>`${i+1}. ${x.s.nama} — ${x.a}`).join('\n'):'Belum ada nilai tercatat.'}
  if(key==='risiko'){
    const L=S.map(s=>{const t=sr(s),r=[],low=raporData(s.id).filter(d=>d.rata<k);
      if(D.eff&&t.pct!==null&&t.pct<80)r.push(`kehadiran ${t.pct}%`);if(t.t.A>=3)r.push(`alpa ${t.t.A} hari`);if(low.length>=2)r.push(`${low.length} mapel di bawah KKTP`);
      return r.length?`${s.nama}: ${r.join(', ')}`:null}).filter(Boolean);
    return L.length?'Perlu perhatian khusus:\n'+L.join('\n'):'Tidak ada siswa yang memenuhi kriteria perhatian khusus (kehadiran di bawah 80%, alpa 3 hari atau lebih, atau 2 mapel di bawah KKTP).'}
  return''
}

let ccS={txt:'',items:null};
function ccLocal(text){
  const S=sortSiswa(),out=[];
  String(text).split(/[\n;]+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>3).forEach(seg=>{
    const n=NORMN(seg);let best=null;
    S.forEach(s=>{const full=NORMN(s.nama),first=full.split(' ')[0];
      [[full,2],[first,1]].forEach(([k,w])=>{if(k&&(n===k||n.startsWith(k+' ')||n.includes(' '+k+' ')||n.endsWith(' '+k))&&(!best||w>best.w||(w===best.w&&k.length>best.k.length)))best={s,w,k}})});
    if(best){const firstMatches=best.w===1?S.filter(s=>NORMN(s.nama).split(' ')[0]===best.k).length:1;
      out.push({nama:best.s.nama,s:firstMatches===1?best.s:null,teks:seg.replace(/[.!?]*$/,'')+'.',dpl:[],on:firstMatches===1})}});
  return out
}
async function ccParse(){
  const t=ccS.txt.trim();if(t.length<6)throw new Error('Tulis, rekam, atau foto catatannya dulu');
  let items=null,ai=false;
  try{const r=await tugas('catatan',{teks:t.slice(0,5000),siswa:sortSiswa().map(s=>s.nama).slice(0,60),kelas:db.guru.kelas},70000);
    items=asArr(r&&r.catatan).map(x=>{const s=siswaRes(cl(norm(x&&x.nama)));return{nama:cl(norm(x&&x.nama)),s,teks:cl(norm(x&&x.teks)),dpl:asArr(x&&x.dpl).map(Number).filter(n=>n>=1&&n<=8),on:!!s}}).filter(x=>x.teks);
    ai=items.length>0}catch(e){}
  if(!ai)items=ccLocal(t);
  if(!items.length)throw new Error('Tidak ada nama siswa yang dikenali. Tulis dengan menyebut nama siswa.');
  ccS.items=items;return ai
}

function diniData(){
  const S=sortSiswa(),D=absSem(),k=kktp();
  return S.map(s=>{
    const r=D.rows.find(x=>x.s.id===s.id)||{t:{H:0,S:0,I:0,A:0},pct:null},al=[],low=raporData(s.id).filter(d=>d.rata<k);let sc=0;
    if(D.eff>=3&&r.pct!==null&&r.pct<80){al.push(`kehadiran ${r.pct}%`);sc+=1}
    if(r.t.A>=3){al.push(`alpa ${r.t.A} hari`);sc+=r.t.A>=5?2:1}
    if(low.length>=2){al.push(`${low.length} mapel di bawah KKTP (${low.map(d=>d.nama).join(', ')})`);sc+=low.length>=3?2:1}
    else if(low.length===1){al.push(`1 mapel di bawah KKTP (${low[0].nama})`);sc+=0.5}
    const dr=db.mapel.filter(m=>{const v=db.nilai.filter(n=>n.siswa===s.id&&n.mapel===m.id&&n.tanggal&&n.nilai!==''&&n.nilai!=null).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(n=>+n.nilai);
      if(v.length<4)return false;const h=Math.floor(v.length/2),av=a=>a.reduce((x,y)=>x+y,0)/a.length;return av(v.slice(h))-av(v.slice(0,h))<=-10}).map(m=>m.nama);
    if(dr.length){al.push(`nilai menurun pada ${dr.join(', ')}`);sc+=1}
    const kd=KG(s.id).dim;if(Object.values(kd).filter(x=>x==='B').length>=3){al.push('beberapa dimensi karakter masih Baru Memulai');sc+=0.5}
    return{s,al,sc,low,r,absen:r.t.A>=3||(D.eff>=3&&r.pct!==null&&r.pct<80)}
  }).filter(x=>x.sc>=1).sort((a,b)=>b.sc-a.sc)
}

function kinFacts(months){

  const A=months.map(absMonth),eff=A.reduce((a,x)=>a+x.eff,0),rows=sortSiswa().map(s=>{let h=0;A.forEach(x=>{const r=x.rows.find(y=>y.s.id===s.id);if(r)h+=r.c.H});return eff?h/eff*100:null}).filter(x=>x!==null);
  const N=db.nilai.filter(n=>inM(n.tanggal)&&n.nilai!==''&&n.nilai!=null),k=kktp();
  const cat=Object.values(db.karakter).reduce((a,x)=>a+((x.cat||[]).filter(c=>inM(c.tgl)).length),0);
  return{periode:months.length===1?monthLabel(months[0]):`${monthLabel(months[0])} – ${monthLabel(months[months.length-1])}`,pertemuan:J.length,mapel:mp,topik:tp,hariEfektif:eff,rataHadir:rows.length?Math.round(rows.reduce((a,b)=>a+b,0)/rows.length):null,
    jmlNilai:N.length,rataNilai:N.length?Math.round(N.reduce((a,n)=>a+ +n.nilai,0)/N.length*10)/10:null,tuntas:N.length?Math.round(N.filter(n=>+n.nilai>=k).length/N.length*100):null,kktp:k,

    rpp:db.rpp.filter(r=>inM(r.updated)).length,soal:db.soal.filter(r=>inM(r.updated)).length,instrumen:db.instrumen.filter(r=>inM(r.updated)).length,catatanKarakter:cat,siswa:db.siswa.length}
}
function kinLocal(jenis,f){

let kxS={soalId:'',manual:'',mapel:'',jenis:'Harian',tgl:today(),tp:'',sheets:[]};
function parseKunci(str){
  const pg=[],is=[];let sec='';
  String(str||'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
    if(/^A\.\s*PILIHAN/i.test(l)){sec='pg';return}if(/^B\.\s*ISIAN/i.test(l)){sec='is';return}if(/^C\.\s*URAIAN/i.test(l)){sec='ur';return}
    const m=l.match(/^(\d+)\.\s*(.*)$/);if(!m)return;if(sec==='pg')pg[+m[1]-1]=m[2].trim().toUpperCase().slice(0,1);else if(sec==='is')is[+m[1]-1]=m[2].trim()});
  return{pg:pg.map(x=>x||''),isian:is.map(x=>x||'')}
}
function kxKey(){
  const s=db.soal.find(x=>x.id===kxS.soalId);
  if(s)return parseKunci(s.kunci);
  const L=(String(kxS.manual).toUpperCase().match(/[A-D]/g)||[]);return{pg:L,isian:[]}
}
function kxTokens(str,nPg){
  const t=String(str||'').trim();if(!t)return[];
  const p=t.split(/\s*[,;\n]\s*/).filter(x=>x!=='');
  if(p.length===1&&nPg>1&&/^[A-Da-d\s]+$/.test(t))return t.toUpperCase().match(/[A-D]/g)||[];
  return p
}
function kxScore(sh,key){
  const n=key.pg.length,tk=kxTokens(sh.ans,n),total=key.pg.length+key.isian.length;let b=0;
  key.pg.forEach((k,i)=>{if(k&&String(tk[i]||'').trim().toUpperCase().charAt(0)===k)b++});
  key.isian.forEach((k,i)=>{const ra=String(tk[n+i]||'').trim().replace(',','.'),rc=String(k||'').trim().replace(',','.'),a=NORMN(ra),c=NORMN(rc);if(c&&a&&(a===c||(ra!==''&&rc!==''&&isFinite(+ra)&&isFinite(+rc)&&+ra===+rc)))b++});
  return{b,total,nilai:total?Math.round(b/total*100):null}
}
function kxLocal(text,key){
  const pg={},m=[...String(text).matchAll(/(?:^|[\s,;])(\d{1,2})\s*[.):\-]?\s*([A-Da-d])(?=[\s,;.)]|$)/g)];m.forEach(x=>{if(!pg[+x[1]])pg[+x[1]]=x[2].toUpperCase()});
  const nm_=(String(text).match(/nama\s*[:.]?\s*([^\n]{2,40})/i)||[])[1]||'';
  return{name:cl(nm_).replace(/\s*(kelas|no|absen).*$/i,''),pg:key.pg.map((_,i)=>pg[i+1]||''),isian:key.isian.map(()=>'')}
}

async function kxFiles(files){

async function mdRun(d,ulang){

  const todo=D.pertemuan.filter(p=>p.s!=='ai').map(p=>p.no);let done=0;
  const ringkasTp=D.tp.map((x,i)=>`TP ${i+1} (pertemuan ${x.pertemuan}): ${x.rumusan}`);
  for(let k=0;k<todo.length;k+=3){
    setP(`⏳ Menyusun langkah pembelajaran… ${done}/${todo.length} pertemuan`);
    await Promise.all(todo.slice(k,k+3).map(async no=>{try{
      const ti=mdTpOf(D,no),r=await tugas('modulp',{...base,no,total:n,tpIni:D.tp[ti]?D.tp[ti].rumusan:'',tpSemua:ringkasTp,menitAwal:mn.awal,menitInti:mn.inti,menitAkhir:mn.akhir,materi:D.materi.konseptual},90000);
      D.pertemuan[no-1]=mdNormP(r,no,d,D)}catch(e){gagal++;D.err=String(e&&e.message||e).slice(0,100)}done++}));
  }
  const tpList=D.tp.map(x=>x.rumusan),lb={mapel:d.mapel,kelas:d.kelas,fase:faseOf(d.kelas),topik:d.topik||d.bab,tpSemua:tpList,materi:D.materi,model:M.n};
  if(D.l3.s!=='ai'){setP('⏳ Menyusun soal dan media…');try{Object.assign(D.l3,mdNorm3(await tugas('modul3',lb,90000)),{s:'ai'})}catch(e){gagal++;D.err=String(e&&e.message||e).slice(0,100)}}
  if(D.l4.s!=='ai'){setP('⏳ Menyusun ringkasan materi dan rubrik…');try{Object.assign(D.l4,mdNorm4(await tugas('modul4',lb,90000)),{s:'ai'})}catch(e){gagal++;D.err=String(e&&e.message||e).slice(0,100)}}
  setP('');return gagal
}

/* ================= SINKRON ONLINE PRIBADI (Cloudflare KV, khusus pemilik) ================= */
const SY_LS='kelasku3d.sync';
const syGet=()=>{try{return JSON.parse(localStorage.getItem(SY_LS)||'{}')||{}}catch{return{}}};
const sySet=o=>{try{localStorage.setItem(SY_LS,JSON.stringify(o))}catch{}};
let syBusy=false,syT=null;
function syJson(){return JSON.stringify(db,function(k,v){return this===db.setting&&k==='api'?undefined:v})}
function syHashOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)+':'+s.length}
const syHash=()=>syHashOf(syJson());
const syWhen=t=>{try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return t||'-'}};
function syStat(t){const e=$('#syStat');if(e)e.textContent=t}
async function syPost(body){
  const s=syGet();if(!s.key)throw new Error('Isi Kunci Sinkron dulu');
  const r=await fetch(apiBase('sync'),{method:'POST',headers:{'content-type':'application/json','x-sync':s.key},body:typeof body==='string'?body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({ok:false,error:'Server tidak merespons (HTTP '+r.status+')'}));return j}
function syApply(j){
  const s=syGet(),keep=db.setting&&db.setting.api;
  try{localStorage.setItem('kelasku3d.prepull',JSON.stringify(db))}catch{}
  db=Object.assign(structuredClone(DEF),j.data);db.setting=Object.assign({},DEF.setting,db.setting);if(keep)db.setting.api=keep;
  sySet({...s,rev:j.rev,hash:syHash(),t:j.t,last:new Date().toISOString()});save();ini();go()
}
async function syPush(force){
  const s=syGet(),js=syJson();if(js.length>20e6)throw new Error('Data terlalu besar untuk disinkronkan (lebih dari 20 MB).');
  const r=await syPost('{"action":"push","rev":'+(s.rev||0)+(force?',"force":true':'')+',"data":'+js+'}');
  if(r.ok){sySet({...s,rev:r.rev,hash:syHashOf(js),t:r.t,last:new Date().toISOString()});return r}
  if(r.conflict)throw Object.assign(new Error(r.error),{conflict:true});
  throw new Error(r.error||'Gagal mengirim')
}
async function syNow(manual){
  const s=syGet();if(!s.key||syBusy)return;syBusy=true;
  try{
    const m=await syPost({action:'meta'});if(!m.ok)throw new Error(m.error);
    const changed=syHash()!==s.hash,newer=m.rev>(s.rev||0);
    if(!newer&&!changed){syStat('Sudah sinkron ✅ (revisi '+m.rev+')');if(manual)toast('Sudah sinkron ✅');return}
    if(newer&&!changed){const j=await syPost({action:'pull'});if(!j.ok)throw new Error(j.error);syApply(j);toast('Data terbaru dari Cloud diterapkan ✅');return}
    if(!newer&&changed){await syPush(false);syStat('Terkirim ke Cloud ✅');if(manual)toast('Data terkirim ke Cloud ✅');return}
    if(!manual){toast('Sinkron: data di Cloud dan di perangkat ini sama-sama berubah. Buka Pengaturan → Sinkron Online.');return}
    if(!s.hash){if(confirm(`Cloud sudah berisi data (revisi ${m.rev}, ${syWhen(m.t)}).\nOK = ambil data Cloud ke perangkat ini (data lama di perangkat ini disimpan sebagai salinan).\nBatal = tidak melakukan apa-apa.`)){const j=await syPost({action:'pull'});if(!j.ok)throw new Error(j.error);syApply(j);toast('Data dari Cloud diterapkan ✅')}return}
    toast('Konflik: data di Cloud dan di perangkat ini sama-sama berubah. Pilih “Kirim ke Cloud” atau “Ambil dari Cloud”.')
  }catch(e){const t=String(e&&e.message||e).slice(0,120);syStat('⚠ '+t);if(manual)toast('Sinkron gagal: '+t)}
  finally{syBusy=false}
}
function schedSync(){const s=syGet();if(!s.auto||!s.key)return;clearTimeout(syT);syT=setTimeout(()=>syNow(false),6000)}
const syCard=()=>{const s=syGet();return `<details class="card" style="padding:14px 18px"><summary><b>☁️ Sinkron Online (khusus pemilik)</b></summary>
  <p class="mut" style="font-size:13px">Menyamakan data di semua perangkat Anda lewat Cloudflare milik Anda sendiri. Perlu penyiapan sekali di server (lihat panduan). Pengguna lain tidak terpengaruh.</p>
  <label>Kunci Sinkron</label><input id="syKey" type="password" value="${esc(s.key||'')}" placeholder="sama dengan SYNC_KEY di Cloudflare" autocomplete="off">
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="syAuto" type="checkbox" ${s.auto?'checked':''} style="width:auto"> Sinkron otomatis (saat aplikasi dibuka dan setelah ada perubahan)</label>
  <div class="row" style="margin-top:12px"><button class="btn t s" data-act="sySave">Simpan &amp; Tes</button><button class="btn a s" data-act="syNow">🔄 Sinkron Sekarang</button></div>
  <div class="row" style="margin-top:8px"><button class="btn s g" data-act="syKirim">⬆ Kirim ke Cloud</button><button class="btn s g" data-act="syAmbil">⬇ Ambil dari Cloud</button></div>
  <p id="syStat" class="mut" style="margin-top:8px;font-size:13px">${s.rev?`Revisi terakhir: ${s.rev} • ${esc(syWhen(s.last||s.t))}`:'Belum pernah sinkron.'}</p></details>
  `};
Object.assign(ACT,{
  sySave:async()=>{const s=syGet();sySet({...s,key:$('#syKey').value.trim(),auto:$('#syAuto').checked});if(!$('#syKey').value.trim()){toast('Kunci dihapus');return}
    try{const m=await syPost({action:'meta'});if(!m.ok)throw new Error(m.error);syStat(`Tersambung ✅ Cloud revisi ${m.rev}${m.t?' • '+syWhen(m.t):''}`);toast('Tersambung ✅')}catch(e){syStat('⚠ '+String(e.message||e).slice(0,120));toast('Gagal tersambung: '+String(e.message||e).slice(0,80))}},
  syNow:()=>syNow(true),
  syKirim:async()=>{if(!confirm('Kirim data perangkat ini ke Cloud? Data di Cloud akan DITIMPA.'))return;
    try{const s=syGet();const m=await syPost({action:'meta'});if(!m.ok)throw new Error(m.error);sySet({...s,rev:m.rev});await syPush(true);syStat('Terkirim ke Cloud ✅');toast('Data terkirim ke Cloud ✅')}catch(e){toast('Gagal: '+String(e.message||e).slice(0,80))}},
  syAmbil:async()=>{if(!confirm('Ambil data dari Cloud? Data di perangkat ini akan DIGANTI (salinan lama disimpan otomatis).'))return;
    try{const j=await syPost({action:'pull'});if(!j.ok)throw new Error(j.error);syApply(j);toast('Data dari Cloud diterapkan ✅')}catch(e){toast('Gagal: '+String(e.message||e).slice(0,80))}}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const s=syGet();if(s.auto&&s.key)syNow(false)}});
setTimeout(()=>{const s=syGet();if(s.auto&&s.key)syNow(false)},2500);

function foGroup(r,by,P5){

function folderView(page,items,rowFn,titleFn,empty){
  if(!items.length)return empty;
  const cfg=foCfg(),rows=[...items].reverse().map(r=>({r,t:cl(String(titleFn(r)||'')),txt:[titleFn(r),r.mapel,r.topik,r.bab,r.kelas,r.tema,r.judul].filter(Boolean).join(' ').toLowerCase()}));
  const sortFn=cfg.sort==='nama'?(a,b)=>foNat(a.t,b.t):null,P5=page==='stem';
  const item=x=>`<div class="foi" data-t="${esc(x.txt)}">${rowFn(x.r)}</div>`;
  const bar=`<div class="card fobar"><input class="foq" data-fo="${page}" type="search" placeholder="🔍 Cari judul, mapel, atau bab…" aria-label="Cari"><div class="g2"><div><label>Kelompokkan</label><select class="fosel" data-fo-k="by"><option value="mapel" ${cfg.by==='mapel'?'selected':''}>Mata Pelajaran</option><option value="mapelkelas" ${cfg.by==='mapelkelas'?'selected':''}>Mapel + Kelas</option><option value="kelas" ${cfg.by==='kelas'?'selected':''}>Kelas</option><option value="none" ${cfg.by==='none'?'selected':''}>Tanpa folder</option></select></div><div><label>Urutan</label><select class="fosel" data-fo-k="sort"><option value="baru" ${cfg.sort==='baru'?'selected':''}>Terbaru dulu</option><option value="nama" ${cfg.sort==='nama'?'selected':''}>Nama (Bab 1, 2, 3…)</option></select></div></div>
    ${cfg.by==='none'?'':`<div class="row" style="margin-top:8px"><button class="btn s g" data-act="foSemua" data-v="1">📂 Buka semua</button><button class="btn s g" data-act="foSemua" data-v="0">📁 Tutup semua</button></div>`}</div>`;
  const body=cfg.by==='none'?`<div class="fob0">${(sortFn?[...rows].sort(sortFn):rows).map(item).join('')}</div>`:(()=>{
    const gs=new Map();rows.forEach(x=>{const g=foGroup(x.r,cfg.by,P5),k=g.toLowerCase();if(!gs.has(k))gs.set(k,{g,list:[]});const e=gs.get(k);if(/^[A-Z]/.test(g)&&!/^[A-Z]/.test(e.g))e.g=g;e.list.push(x)});
    const arr=[...gs.values()].sort((a,b)=>(/^tanpa/i.test(a.g)-/^tanpa/i.test(b.g))||foNat(a.g,b.g)),first=rows[0]?foGroup(rows[0].r,cfg.by,P5).toLowerCase():'';
    const op=cfg.open[page]||{};
    return arr.map(f=>{const key=f.g.toLowerCase(),isOpen=key in op?op[key]:(arr.length<=3||key===first);
      return `<div class="fo" data-g="${esc(key)}"><button class="foh" data-act="foTog" data-p="${page}" data-g="${esc(key)}" aria-expanded="${isOpen}"><span class="fa">${isOpen?'📂':'📁'}</span><span>${esc(f.g)}</span><span class="n">${f.list.length}</span></button><div class="fob" ${isOpen?'':'hidden'}>${(sortFn?[...f.list].sort(sortFn):f.list).map(item).join('')}</div></div>`}).join('')})();
  return (rows.length>=3?bar:'')+`<div class="fowrap" data-fopage="${page}">${body}</div><div class="card empty foempty" hidden><b>🔍</b>Tidak ada yang cocok.</div>`
}
Object.assign(ACT,{
  foTog:(d,b)=>{const box=b.nextElementSibling,open=box.hidden;box.hidden=!open;b.setAttribute('aria-expanded',String(open));b.querySelector('.fa').textContent=open?'📂':'📁';
    const c=foCfg();(c.open[d.p]=c.open[d.p]||{})[d.g]=open;foSave(c)},
  foSemua:(d,b)=>{const w=b.closest('.card').parentElement.querySelector('.fowrap');if(!w)return;const v=d.v==='1',p=w.dataset.fopage,c=foCfg();c.open[p]={};
    w.querySelectorAll('.fo').forEach(f=>{const h=f.querySelector('.foh');f.querySelector('.fob').hidden=!v;h.setAttribute('aria-expanded',String(v));h.querySelector('.fa').textContent=v?'📂':'📁';c.open[p][f.dataset.g]=v});foSave(c)}
});
view.addEventListener('input',e=>{const t=e.target;if(!(t.classList&&t.classList.contains('foq')))return;
  const q=t.value.trim().toLowerCase(),w=view.querySelector('.fowrap');if(!w)return;let any=false;
  w.querySelectorAll('.foi').forEach(i=>{const s=!q||i.dataset.t.includes(q);i.hidden=!s;if(s)any=true});
  w.querySelectorAll('.fo').forEach(f=>{const n=[...f.querySelectorAll('.foi')].filter(i=>!i.hidden).length;f.hidden=!n;if(q&&n){f.querySelector('.fob').hidden=false;f.querySelector('.foh').setAttribute('aria-expanded','true');f.querySelector('.fa').textContent='📂'}});
  const em=view.querySelector('.foempty');if(em)em.hidden=any});
view.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('fosel')){const c=foCfg();c[t.dataset.foK]=t.value;foSave(c);go()}});

{const tmp={...PAGES};Object.keys(PAGES).forEach(k=>delete PAGES[k]);['dashboard','asisten','dini','guru','impor','siswa','mapel','kalender','rpp','modul','diff','perangkat','stem','soal','bahan','instrumen','asesmen','jadwal','absensi','absrekap','nilai','nilaicepat','koreksi','leger','tl','catcepat','karakter','rapor','kartu','jurnal','surat','kinerja','rekap','excel','wali','tahun','setting'].forEach(k=>{if(tmp[k])PAGES[k]=tmp[k]})}


/* ===== navigasi ===== */
const nav=$('#drawer');
nav.innerHTML=Object.entries(PAGES).map(([k,p])=>`<div class="ni" data-p="${k}" role="link" tabindex="0"><span class="ic">${p.icon}</span>${p.label}</div>`).join('');
nav.insertAdjacentHTML('beforeend','<div class="ncr"><b>KelasKu</b><br>Design by Akhmad Fitra Harry, S.Pd</div>');
const closeNav=()=>{nav.classList.remove('open');$('#ov').classList.remove('on')};
nav.addEventListener('click',e=>{const n=e.target.closest('.ni');if(!n)return;const p=n.dataset.p;if(p==='rpp')rppEdit=null;if(p==='perangkat')perEdit=null;if(p==='soal')soalEdit=null;if(p==='instrumen')insEdit=null;if(p==='diff')dfEdit=null;if(p==='bahan')bhEdit=null;if(p==='stem')stEdit=null;if(p==='modul')mdEdit=null;if(p==='siswa')imp=null;if(location.hash==='#/'+p){go()}else location.hash='#/'+p;closeNav()});
$('#burger').onclick=()=>{nav.classList.toggle('open');$('#ov').classList.toggle('on')};
$('#ov').onclick=closeNav;
$('#mc').onclick=()=>$('#modal').classList.remove('on');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('on')});
function go(){
  const p=location.hash.slice(2)||'dashboard',pg=PAGES[p]||PAGES.dashboard,k=PAGES[p]?p:'dashboard';
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.p===k));
  $('#ptitle').textContent=pg.label;document.title='KelasKu — '+pg.label;pg.render(view);
}
function ini(){const n=(db.guru.nama||'Guru').trim().split(/\s+/);$('#av').textContent=((n[0]||'G')[0]+(n[1]||n[0]||'R')[0]).toUpperCase()}
window.addEventListener('hashchange',()=>{closeNav();go();scrollTo(0,0)});

/* ===== efek 3D: miring mengikuti kursor + kubus latar ===== */
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const c=e.target.closest&&e.target.closest('.tilt');if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(800px) rotateX(${-y*7}deg) rotateY(${x*9}deg) translateZ(6px)`});
document.addEventListener('pointerleave',e=>{if(e.target.classList&&e.target.classList.contains('tilt'))e.target.style.transform=''},true);
$('#bg').innerHTML=[[6,12,46],[82,8,64],[90,52,38],[8,62,58],[48,84,44],[70,78,30]].map(([l,t,s],i)=>`<div class="fl" style="left:${l}%;top:${t}%;animation-delay:-${i*1.4}s"><div class="cube bg" style="--s:${s}px;animation-duration:${14+i*3}s">${'<i></i>'.repeat(6)}</div></div>`).join('');

if(driveReady()&&(db.siswa.length||db.rpp.length||db.nilai.length)&&(!db.setting.lastBackup||Date.now()-db.setting.lastBackup>864e5))pendBk=true;
ini();go();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
