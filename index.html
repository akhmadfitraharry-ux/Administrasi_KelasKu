<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KelasKu — Administrasi Guru SD</title>
<meta name="theme-color" content="#1b1446">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--ink:#1b1f3b;--mut:#6a6f8f;--bg:#eceaff;--p:#6d4aff;--p2:#4b2fd0;--t:#00b8a0;--t2:#008f7d;--a:#ffb020;--a2:#d68a00;--r:#ff4d6d;--r2:#c9304c;--rad:20px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#d9d2ff,transparent),radial-gradient(900px 500px at 100% 10%,#c9f6ee,transparent),var(--bg);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h2,h3,h4{line-height:1.25}.mut,small{color:var(--mut)}
/* latar kubus 3D */
.bg3d{position:fixed;inset:0;perspective:900px;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-28px)}}
.cube{--s:80px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-style:normal;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);border-radius:10px}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.cube.bg i{background:linear-gradient(135deg,rgba(109,74,255,.22),rgba(0,184,160,.18));border:1px solid rgba(109,74,255,.3)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
.scene{perspective:600px;width:130px;height:130px;display:grid;place-items:center;flex:none}
/* header + drawer */
header{position:fixed;inset:0 0 auto 0;height:64px;z-index:30;background:linear-gradient(135deg,#1b1446,#2d1f78);display:flex;align-items:center;gap:12px;padding:0 14px;color:#fff;box-shadow:0 6px 0 rgba(27,20,70,.2),0 14px 30px rgba(27,20,70,.35)}
.burger{width:44px;height:44px;border-radius:14px;border:0;font-size:22px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#5b46c9,#3a2a9a);box-shadow:0 4px 0 #20156b}
.burger:active{transform:translateY(3px);box-shadow:0 1px 0 #20156b}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,#ffd35a,#ff9d00);color:#4a2d00;box-shadow:0 4px 0 #b36b00,0 8px 14px rgba(0,0,0,.3);transform:rotate(-6deg)}
.brand{flex:1;min-width:0;line-height:1.15}.brand small{color:#b7aaff;display:block}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(145deg,#00d6bb,#00907d);box-shadow:0 4px 0 #006054}
#ov{position:fixed;inset:0;background:rgba(20,10,60,.45);z-index:24;display:none}#ov.on{display:block}
nav{position:fixed;top:64px;bottom:0;left:0;width:280px;z-index:25;background:#fff;padding:12px;overflow:auto;transform:translateX(-104%);transition:transform .3s;box-shadow:10px 0 30px rgba(40,20,120,.25)}
nav.open{transform:none}
.ni{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;font-weight:650;cursor:pointer;margin-bottom:4px;transition:.2s;user-select:none}
.ni .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#fff,#e6e2ff);box-shadow:0 4px 0 #c9c2f5,0 8px 12px rgba(80,60,200,.18);transition:.2s}
.ni:hover .ic{transform:translateY(-2px) rotate(-6deg)}
.ni.on{background:linear-gradient(135deg,#efeaff,#dffaf4);color:var(--p2)}
main{position:relative;z-index:1;padding:84px 16px 48px}.wrap{max-width:1000px;margin:auto}
@media(min-width:980px){nav{transform:none}main{margin-left:280px}.burger{display:none}#ov{display:none!important}}
/* komponen 3D */
.card{background:#fff;border-radius:var(--rad);padding:16px;box-shadow:0 6px 0 #d8d3f7,0 18px 30px rgba(60,40,160,.16);transition:transform .15s ease-out,box-shadow .2s;will-change:transform;margin-bottom:16px;display:block;color:inherit;text-decoration:none}
.card h3{margin-bottom:10px}
.btn{--c1:#8a6cff;--c2:var(--p);--sh:var(--p2);border:0;cursor:pointer;font:inherit;font-weight:750;color:#fff;padding:11px 18px;border-radius:14px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--sh),0 12px 18px rgba(60,40,160,.3);transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(60,40,160,.25)}
.btn.t{--c1:#2fdcc5;--c2:var(--t);--sh:var(--t2)}
.btn.a{--c1:#ffd35a;--c2:var(--a);--sh:var(--a2);color:#432a00}
.btn.r{--c1:#ff7b93;--c2:var(--r);--sh:var(--r2)}
.btn.g{--c1:#fff;--c2:#f1eeff;--sh:#cfc8f7;color:var(--p2)}
.btn.s{padding:7px 12px;font-size:14px;border-radius:11px;box-shadow:0 4px 0 var(--sh),0 8px 12px rgba(60,40,160,.2)}
.btn:disabled{opacity:.7;cursor:wait}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border-radius:12px;border:2px solid #ddd8fb;background:#faf9ff;color:var(--ink);box-shadow:inset 0 3px 6px rgba(80,60,200,.08)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label{display:block;font-weight:650;font-size:14px;margin:12px 0 5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:16px}
.grid .card{margin:0}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
.bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.bar input{flex:1;min-width:150px}
.item{display:flex;gap:12px;align-items:center}
.ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(145deg,#fff,#e6e2ff);box-shadow:0 5px 0 #c9c2f5,0 10px 14px rgba(80,60,200,.2)}
.im{flex:1;min-width:0}.im small{display:block}.im p{margin-top:6px;font-size:14px;white-space:pre-wrap}
.ia{display:flex;gap:8px;flex:none}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}.empty b{font-size:42px;display:block}
.hero{display:flex;gap:10px;align-items:center;justify-content:space-between;color:#fff;border-radius:26px;padding:22px;margin-bottom:18px;background:linear-gradient(135deg,#1b1446,#4b2fd0 60%,#00b8a0);box-shadow:0 8px 0 #130c36,0 22px 36px rgba(40,20,140,.4);transition:transform .15s ease-out}
.hero h2{font-size:24px;margin:4px 0}.hero p{opacity:.85;margin-bottom:14px}.hero small{color:#cfc6ff}
.stat{text-align:center}.stat span{font-size:30px;display:block}.stat b{font-size:30px;display:block}
.chip{display:inline-block;padding:6px 12px;border-radius:12px;font-weight:700;color:#fff;margin:0 6px 6px 0;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.c-H{background:var(--t)}.c-S{background:var(--a);color:#432a00}.c-I{background:#3b82f6}.c-A{background:var(--r)}
.ab{display:flex;gap:6px}.ab button{width:40px;height:40px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer;background:#efecff;color:var(--p2);box-shadow:0 4px 0 #cfc8f7}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc8f7}
.ab button.on{color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ab button.on[data-v=H]{background:var(--t)}.ab button.on[data-v=S]{background:var(--a);color:#432a00}.ab button.on[data-v=I]{background:#3b82f6}.ab button.on[data-v=A]{background:var(--r)}
.tbl{overflow:auto}.tbl table,#printArea table{border-collapse:collapse;width:100%}.tbl td,.tbl th{padding:8px 10px;border-bottom:1px solid #e6e2ff;text-align:left;font-size:14px;vertical-align:top}.tbl th{background:#f4f1ff}
.p5{display:flex;flex-wrap:wrap;gap:8px}.p5 label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500;background:#f4f1ff;padding:7px 10px;border-radius:12px}.p5 input{width:auto;box-shadow:none}
.sec{border-left:5px solid var(--p);padding-left:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,10,60,.55);display:none;z-index:50;padding:16px;overflow:auto;backdrop-filter:blur(4px)}
.modal.on{display:grid;place-items:center}.mbox{width:100%;max-width:520px;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1b1446;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;transition:.3s;box-shadow:0 5px 0 #0c0726;max-width:90vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.ab button.on[data-v=B]{background:var(--r)}.ab button.on[data-v=K]{background:var(--a);color:#432a00}.ab button.on[data-v=C]{background:var(--t)}.ab button.on[data-v=M]{background:var(--p)}
.cmp{border-collapse:collapse;font-size:12px;width:100%}.cmp th,.cmp td{border:1px solid #cfc8f7;padding:4px 5px;text-align:center}.cmp td:nth-child(2),.cmp th:nth-child(2){text-align:left;white-space:nowrap}
.note{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #e6e2ff;padding:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .hd{text-align:center;font-weight:700;font-size:12px;color:var(--mut)}.cal .cd{min-height:54px;border-radius:10px;background:#faf9ff;padding:4px;font-size:12px;overflow:hidden}.cal .cd.t{outline:2px solid var(--p);background:#efeaff}
@media print{#printArea .cmp td,#printArea .cmp th{text-align:center;padding:2px 3px;font-size:10px}#printArea .cmp td:nth-child(2){text-align:left}}
#printArea{display:none}
.pb{page-break-after:always;break-after:page}
.brand small.cr{font-size:10.5px;line-height:1.2;margin-top:2px}#ptitle{max-width:1000px;margin:0 auto 14px;font-size:22px}.ncr{margin:18px 8px 8px;padding-top:12px;border-top:1px dashed #d8d3f7;font-size:12px;color:var(--mut);text-align:center;line-height:1.5}.ncr b{color:var(--p2);font-size:14px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff;padding:8mm}
#printArea td,#printArea th{border:1px solid #000;padding:4px 6px;font-size:12px;vertical-align:top;text-align:left}
.kop{text-align:center;border-bottom:3px double #000;margin-bottom:12px;padding-bottom:6px}.ttd{display:flex;justify-content:space-between;margin-top:36px}.ttd div{text-align:center;width:42%}.pw{white-space:pre-wrap;font-size:13px}}
</style>
</head>
<body>
<div class="bg3d" id="bg"></div>
<header>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="logo">KK</div>
  <div class="brand"><b>KelasKu</b><small class="cr">Design by Akhmad Fitra Harry, S.Pd</small></div>
  <div class="av" id="av">GR</div>
</header>
<div id="ov"></div>
<nav id="drawer"></nav>
<main><h2 id="ptitle"></h2><div id="view"></div></main>
<div class="modal" id="modal"><form id="mf" class="card mbox"><h3 id="mt"></h3><div id="mb"></div><div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn g" id="mc">Batal</button><button class="btn t">Simpan</button></div></form></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const KELAS=['1','2','3','4','5','6'];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const faseOf=k=>{k=parseInt(k);return k<=2?'A':k<=4?'B':k<=6?'C':''};
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const nm=(col,id,key='nama')=>(db[col].find(x=>x.id===id)||{})[key]||'-';

/* ===== penyimpanan lokal (offline-first) ===== */
const KEY='kelasku3d.v1';
const DEF={guru:{nama:'',nip:'',sekolah:'',npsn:'',kelas:'',tahun:'2026/2027',semester:'Ganjil',kepsek:'',nipKepsek:''},siswa:[],mapel:[],rpp:[],asesmen:[],jadwal:[],absensi:{},nilai:[],jurnal:[],catatan:{},karakter:{},projek:[],kalender:[],tl:{},arsip:[],rapor:{},perangkat:[],soal:[],setting:{api:'/api/generate',kktp:70}};
let db=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(structuredClone(DEF),s)}catch{return structuredClone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Penyimpanan penuh / diblokir browser')}schedAuto()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}

/* ===== modul CRUD generik ===== */
const MODS={
siswa:{label:'Data Siswa',col:'siswa',icon:'🧒',fields:[{k:'nis',l:'NIS / NISN'},{k:'nama',l:'Nama Lengkap',req:1},{k:'jk',l:'Jenis Kelamin',t:'select',o:['L','P'],req:1},{k:'ortu',l:'Nama Orang Tua / Wali'}],
  title:r=>r.nama,sub:r=>`NIS ${r.nis||'-'} • ${r.jk==='L'?'Laki-laki':r.jk==='P'?'Perempuan':'L/P belum diisi'}${r.ortu?' • Wali: '+r.ortu:''}`,sort:(a,b)=>a.nama.localeCompare(b.nama)},
mapel:{label:'Mata Pelajaran',col:'mapel',icon:'📚',fields:[{k:'nama',l:'Nama Mata Pelajaran',req:1},{k:'kelas',l:'Kelas',t:'select',o:KELAS},{k:'jp',l:'Jam Pelajaran / Minggu',t:'number',min:0,max:40}],
  title:r=>r.nama,sub:r=>`Kelas ${r.kelas||'-'} • Fase ${faseOf(r.kelas)||'-'} • ${r.jp||0} JP/minggu`,extra:`<button class="btn a" data-act="preset">⚡ Isi Mapel SD</button>`},
asesmen:{label:'Rencana Asesmen',col:'asesmen',icon:'📝',fields:[{k:'judul',l:'Judul Asesmen',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama'},{k:'jenis',l:'Jenis',t:'select',o:['Diagnostik','Formatif','Sumatif']},{k:'tanggal',l:'Tanggal',t:'date'},{k:'teknik',l:'Teknik / Instrumen'},{k:'tujuan',l:'Tujuan / Catatan',t:'textarea'}],
  title:r=>r.judul,sub:r=>`${r.jenis||'-'} • ${nm('mapel',r.mapel)} • ${fmtD(r.tanggal)}`,body:r=>[r.teknik,r.tujuan].filter(Boolean).join('\n'),sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')},
jadwal:{label:'Jadwal Kelas',col:'jadwal',icon:'🗓️',fields:[{k:'hari',l:'Hari',t:'select',o:HARI.slice(1,7),req:1},{k:'mulai',l:'Jam Mulai',t:'time',req:1},{k:'selesai',l:'Jam Selesai',t:'time',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama',req:1}],
  title:r=>nm('mapel',r.mapel),sub:r=>`${r.hari} • ${r.mulai}–${r.selesai}`,sort:(a,b)=>HARI.indexOf(a.hari)-HARI.indexOf(b.hari)||(a.mulai||'').localeCompare(b.mulai||'')},
nilai:{label:'Nilai Siswa',col:'nilai',icon:'🏅',fields:[{k:'siswa',l:'Siswa',t:'select',ref:'siswa',rl:'nama',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama',req:1},{k:'jenis',l:'Jenis Nilai',t:'select',o:['Harian','Tugas','Proyek','UTS','UAS']},{k:'tp',l:'Materi / Tujuan Pembelajaran (untuk deskripsi rapor)'},{k:'nilai',l:'Nilai (0–100)',t:'number',min:0,max:100,req:1},{k:'tanggal',l:'Tanggal',t:'date',d:'today'}],
  title:r=>`${nm('siswa',r.siswa)} — ${r.nilai}`,sub:r=>`${nm('mapel',r.mapel)} • ${r.jenis||'-'} • ${fmtD(r.tanggal)}${r.tp?' • '+r.tp:''}`,sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')},
jurnal:{label:'Jurnal Mengajar',col:'jurnal',icon:'📖',fields:[{k:'tanggal',l:'Tanggal',t:'date',d:'today',req:1},{k:'mapel',l:'Mata Pelajaran',t:'select',ref:'mapel',rl:'nama'},{k:'materi',l:'Materi',t:'textarea',req:1},{k:'kegiatan',l:'Kegiatan Pembelajaran',t:'textarea'},{k:'refleksi',l:'Refleksi / Tindak Lanjut',t:'textarea'}],
  title:r=>`${fmtD(r.tanggal)} • ${nm('mapel',r.mapel)}`,sub:r=>r.materi,body:r=>r.refleksi?'Refleksi: '+r.refleksi:'',sort:(a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')}
};
function fieldHtml(f,val){
  const req=f.req?'required':'';
  if(f.t==='select'){
    const o=f.ref?db[f.ref].map(r=>[r.id,r[f.rl]]):f.o.map(x=>[x,x]);
    const warn=f.ref&&!o.length?`<small>⚠ Isi menu terkait dulu (${f.l}).</small>`:'';
    return `<label>${f.l}</label><select name="${f.k}" ${req}><option value="">— pilih —</option>${o.map(([v,l])=>`<option value="${esc(v)}" ${v==val?'selected':''}>${esc(l)}</option>`).join('')}</select>${warn}`;
  }
  if(f.t==='textarea')return `<label>${f.l}</label><textarea name="${f.k}" ${req}>${esc(val)}</textarea>`;
  return `<label>${f.l}</label><input name="${f.k}" type="${f.t||'text'}" value="${esc(val)}" ${req} ${f.min!=null?`min="${f.min}" max="${f.max}"`:''}>`;
}
function openForm(key,id){
  const M=MODS[key],r=id?db[M.col].find(x=>x.id===id):null;
  $('#mt').textContent=(id?'Ubah ':'Tambah ')+M.label;
  $('#mb').innerHTML=M.fields.map(f=>fieldHtml(f,r?r[f.k]:(f.d==='today'?today():f.d||''))).join('');
  $('#mf').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o=r||{id:uid()};
    M.fields.forEach(f=>o[f.k]=f.t==='number'?(fd.get(f.k)===''?'':+fd.get(f.k)):fd.get(f.k));
    if(!r)db[M.col].push(o);save();$('#modal').classList.remove('on');toast('Tersimpan ✅');go()};
  $('#modal').classList.add('on');
}
function renderMod(v,key,q=''){
  const M=MODS[key];let rows=[...db[M.col]];if(M.sort)rows.sort(M.sort);
  if(q)rows=rows.filter(r=>(M.title(r)+' '+M.sub(r)+' '+(M.body?M.body(r):'')).toLowerCase().includes(q.toLowerCase()));
  v.innerHTML=`<div class="wrap"><div class="bar"><input id="q" type="search" placeholder="Cari ${M.label.toLowerCase()}…" value="${esc(q)}"><button class="btn t" data-act="add" data-k="${key}">＋ Tambah</button>${M.extra||''}</div>
  ${rows.length?rows.map(r=>`<div class="card tilt item"><div class="ib">${M.icon}</div><div class="im"><b>${esc(M.title(r))}</b><small>${esc(M.sub(r))}</small>${M.body&&M.body(r)?`<p>${esc(M.body(r))}</p>`:''}</div><div class="ia"><button class="btn s g" data-act="edit" data-k="${key}" data-id="${r.id}" aria-label="Ubah">✏️</button><button class="btn s r" data-act="del" data-k="${key}" data-id="${r.id}" aria-label="Hapus">🗑</button></div></div>`).join(''):`<div class="card empty"><b>${M.icon}</b>Belum ada data. Tekan “Tambah” untuk memulai.</div>`}</div>`;
  const i=$('#q');i.oninput=e=>{renderMod(v,key,e.target.value);const n=$('#q');n.focus();n.setSelectionRange(99,99)};
}

/* ===== dataset untuk rekap, cetak & excel ===== */
function DS(){
  const s=[...db.siswa].sort((a,b)=>a.nama.localeCompare(b.nama));
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:'';
  return{
    siswa:{label:'Daftar Siswa',icon:'🧒',head:['No','NIS','Nama','L/P','Orang Tua / Wali'],rows:s.map((x,i)=>[i+1,x.nis,x.nama,x.jk,x.ortu])},

function imgToJpeg(file,max=1400){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};i.onerror=()=>rej(new Error('Gambar tidak bisa dibuka'));i.src=u})}
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Berkas gagal dibaca'));r.readAsDataURL(f)});
async function readSource(f){
  if(/^text\//.test(f.type)||/\.(txt|md|csv)$/i.test(f.name||''))return await f.text();
  if(f.size>8*1024*1024)throw new Error('Ukuran maksimal 8 MB');
  let data,type=f.type;
  if(/^image\//.test(f.type)){data=(await imgToJpeg(f)).split(',')[1];type='image/jpeg'}else data=await fileB64(f);
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),90000);
  try{
    const r=await fetch(apiBase('extract'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name||'foto.jpg',type,data}),signal:c.signal});
    const j=await r.json();if(!j.ok){const e=new Error(j.error||'gagal dibaca');e.srv=1;throw e}
    return j.text||'';
  }catch(e){if(e.srv)throw e;throw new Error(e.name==='AbortError'?'Waktu habis':'AI online belum tersambung — ketik atau tempel teks sumber manual')}
  finally{clearTimeout(tm)}
}

let raporSid='';
function raporData(sid){
  return db.mapel.map(m=>{
    const ns=db.nilai.filter(n=>n.siswa===sid&&n.mapel===m.id&&n.nilai!==''&&n.nilai!=null);if(!ns.length)return null;
    const rata=Math.round(ns.reduce((a,n)=>a+ +n.nilai,0)/ns.length*10)/10,by={};
    ns.forEach(n=>{const k=(n.tp||'').trim();if(k)(by[k]=by[k]||[]).push(+n.nilai)});
    const arr=Object.entries(by).map(([tp,v])=>({tp,nilai:Math.round(v.reduce((a,b)=>a+b,0)/v.length)})).sort((a,b)=>b.nilai-a.nilai);
    return{id:m.id,nama:m.nama,rata,tertinggi:arr[0]||null,terendah:arr.length>1?arr[arr.length-1]:null}
  }).filter(Boolean)
}
function localRapor(s,data){
  const n=s.nama.trim().split(/\s+/)[0],k=kktp(),m={};
  data.forEach(d=>{
    const p=predikat(d.rata).toLowerCase();let t;
    if(d.tertinggi){
      t=`Ananda ${n} menunjukkan capaian ${p} pada mata pelajaran ${d.nama}, terutama dalam ${d.tertinggi.tp}.`;
      if(d.terendah)t+=d.terendah.nilai<k?` Ananda masih perlu bimbingan dan latihan lebih lanjut dalam ${d.terendah.tp}.`:` Ananda juga sudah baik dalam ${d.terendah.tp}.`;
    }else t=d.rata>=k?`Ananda ${n} menunjukkan capaian ${p} pada mata pelajaran ${d.nama} dan sudah mencapai ketuntasan. Terus pertahankan semangat belajarnya.`:`Ananda ${n} masih perlu bimbingan lebih lanjut pada mata pelajaran ${d.nama}. Pendampingan dan latihan rutin akan membantu ananda berkembang.`;
    m[d.id]=t});
  const all=data.reduce((a,d)=>a+d.rata,0)/data.length;
  return{m,wali:`Ananda ${n} menunjukkan perkembangan belajar yang ${all>=80?'sangat baik':all>=kktp()?'baik':'perlu terus didampingi'}. Dukungan belajar di rumah akan membantu ananda semakin percaya diri.`};
}
async function raporGen(sid){
  const s=db.siswa.find(x=>x.id===sid),data=raporData(sid);if(!s||!data.length)return null;
  const R=db.rapor[sid]=db.rapor[sid]||{m:{},wali:''},loc=localRapor(s,data);let res=null;
  try{res=await tugas('rapor',{nama:s.nama,jk:s.jk,kelas:db.guru.kelas,kktp:kktp(),mapel:data.map(({nama,rata,tertinggi,terendah})=>({nama,rata,tertinggi,terendah})),catatan:[db.catatan[sid]||'',(db.karakter[sid]&&db.karakter[sid].ringkasan)?'Karakter: '+db.karakter[sid].ringkasan:''].filter(Boolean).join(' ')},70000)}catch(e){res=null}
  const ai=!!(res&&res.deskripsi);
  data.forEach(d=>{const t=ai?norm(pickKey(res.deskripsi,d.nama)):'';R.m[d.id]=t.trim()||loc.m[d.id]});
  R.wali=(ai&&norm(res.catatan_wali).trim())||loc.wali;save();return ai?'ai':'local'
}

function distJp(items,total){
  if(!items.length)return;const w=items.map(i=>Math.max(0,+i.jp||0)),sum=w.reduce((a,b)=>a+b,0),base=sum?w:items.map(()=>1),bs=base.reduce((a,b)=>a+b,0);
  const raw=base.map(x=>x*total/bs),fl=raw.map(Math.floor);let rem=total-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){fl[i]++;rem--}});items.forEach((it,i)=>it.jp=fl[i])
}

let imp=null;
function delimRows(t){
  t=String(t).replace(/^\uFEFF/,'');const first=t.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=c=>first.split(c).length-1,sep=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0];const S=sep[1]?sep[0]:',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===S){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''))
}

  const rows=[];

      if(ref){let c=0;for(const ch of ref)c=c*26+ch.charCodeAt(0)-64;r[c-1]=String(v).trim()}}
    for(let i=0;i<r.length;i++)if(r[i]==null)r[i]='';

  return rows
}
const JKN=v=>{v=String(v||'').trim().toLowerCase();if(!v)return'';if(/^(l|lk|laki|laki-laki|laki laki|pria|m|male|cowok)$/.test(v))return'L';if(/^(p|pr|perempuan|wanita|f|female|cewek)$/.test(v))return'P';return''};
const fixNis=x=>{x=String(x||'').trim();if(/^\d+(\.\d+)?e\+?\d+$/i.test(x))x=Number(x).toFixed(0);return x.replace(/\.0+$/,'')};
function mapSiswa(rows){
  let hdr=-1,col={};
  for(let i=0;i<Math.min(6,rows.length)&&hdr<0;i++){const c={};
    rows[i].forEach((x,j)=>{const k=String(x).toLowerCase().replace(/[^a-z]/g,'');if(!k)return;
      if(/^(jk|lp|jeniskelamin|kelamin|gender|sex)$/.test(k))c.jk=j;
      else if(/^(hp|wa|whatsapp|telepon|telp|nohp|nomorhp|notelp|kontak)/.test(k))c.hp=j;
      else if(/ortu|orangtua|wali|ayah|ibu|bapak/.test(k))c.ortu=j;
      else if(/nama|^siswa$|^pesertadidik$/.test(k))c.nama=j;
      else if(/^(nis|nisn|nomorinduk|noinduk|induk)/.test(k))c.nis=j});
    if(c.nama!==undefined){hdr=i;col=c}}
  let data;
  if(hdr>=0)data=rows.slice(hdr+1);
  else{
    data=rows;const nc=Math.max(...rows.map(r=>r.length));const st=[];
    for(let j=0;j<nc;j++){const v=rows.map(r=>String(r[j]??'').trim()).filter(Boolean);st.push({n:v.length,jk:v.filter(x=>JKN(x)).length,num:v.filter(x=>/^\d{4,}$/.test(x)).length,al:v.filter(x=>/^[A-Za-z][A-Za-z .,'’\-]{4,}$/.test(x)).length})}
    st.forEach((s,j)=>{if(s.n>=2&&s.jk/s.n>=0.8&&col.jk===undefined)col.jk=j});
    st.forEach((s,j)=>{if(s.n>=2&&s.num/s.n>=0.8&&col.nis===undefined)col.nis=j});
    const names=st.map((s,j)=>[s,j]).filter(([s,j])=>j!==col.jk&&j!==col.nis&&s.n>=2&&s.al/s.n>=0.7).map(([,j])=>j);
    if(names[0]!==undefined)col.nama=names[0];if(names[1]!==undefined)col.ortu=names[1]}
  if(col.nama===undefined)return null;
  const list=[];
  data.forEach(r=>{const nama=String(r[col.nama]??'').replace(/\s+/g,' ').trim();if(!nama||/^\d+$/.test(nama)||/^(no|nama|jumlah|total)$/i.test(nama))return;
    list.push({nama,nis:col.nis!==undefined?fixNis(r[col.nis]):'',jk:col.jk!==undefined?JKN(r[col.jk]):'',ortu:col.ortu!==undefined?String(r[col.ortu]??'').trim():'',hp:col.hp!==undefined?String(r[col.hp]??'').trim():''})});
  return{col,hdr:hdr>=0,list}
}
function impDup(list){
  const sn=new Set(db.siswa.map(s=>String(s.nama||'').trim().toLowerCase())),si=new Set(db.siswa.filter(s=>s.nis).map(s=>String(s.nis).trim()));
  list.forEach(x=>{const kn=x.nama.toLowerCase();x.dup=sn.has(kn)||!!(x.nis&&si.has(x.nis));if(!x.dup){sn.add(kn);if(x.nis)si.add(x.nis)}})
}
function impSet(rows){
  if(!rows||!rows.length){toast('Tidak ada data yang terbaca');return}
  const M=mapSiswa(rows);if(!M||!M.list.length){toast('Kolom nama siswa tidak ditemukan. Pastikan ada kolom “Nama”.');return}

}
async function impFile(f){
  try{const buf=await f.arrayBuffer(),u=new Uint8Array(buf);let rows;
    if(u[0]===0x50&&u[1]===0x4B)rows=await xlsxRows(buf);
    else if(u[0]===0xD0&&u[1]===0xCF)throw new Error('Format .xls lama belum didukung. Simpan ulang sebagai .xlsx atau .csv.');
    else{const t=new TextDecoder('utf-8').decode(u);rows=/^\s*</.test(t.replace(/^\uFEFF/,''))?htmlRows(t):delimRows(t)}

}

const DAYI=['M','S','S','R','K','J','S'];

function absMonth(ymv){
  const [y,m]=ymv.split('-').map(Number),n=dayN(y,m),dates=Array.from({length:n},(_,i)=>`${ymv}-${pad(i+1)}`);
  const eff=dates.filter(d=>db.absensi[d]&&Object.keys(db.absensi[d]).length).length;
  const rows=sortSiswa().map(s=>{const c={H:0,S:0,I:0,A:0};const cells=dates.map(d=>{const v=(db.absensi[d]||{})[s.id]||'';if(v)c[v]++;return v});return{s,cells,c,pct:eff?Math.round(c.H/eff*100):null}});
  return{y,m,n,dates,eff,rows}
}
function semMonths(){const g=db.guru,[a,b]=String(g.tahun||'').split('/').map(Number),y1=a||new Date().getFullYear(),y2=b||y1+1;return g.semester==='Genap'?Array.from({length:6},(_,i)=>`${y2}-${pad(i+1)}`):Array.from({length:6},(_,i)=>`${y1}-${pad(i+7)}`)}
function absSem(){

}

  const rs=rows.filter(r=>r.rata!==null).map(r=>r.rata).sort((a,b)=>b-a);rows.forEach(r=>r.rank=r.rata===null?'':rs.indexOf(r.rata)+1);

function karHtml(sid){
  const s=db.siswa.find(x=>x.id===sid),k=KG(sid),g=db.guru;
  return hasil('LAPORAN PERKEMBANGAN KARAKTER DAN PROJEK')+`<table style="border:0;margin:6px 0">${[['Nama',s.nama],['NIS',s.nis||'-'],['Kelas',g.kelas||'-'],['Semester',g.semester+' • TA '+g.tahun]].map(([a,b])=>`<tr><td style="border:0" width="20%"><b>${a}</b></td><td style="border:0">: ${esc(b)}</td></tr>`).join('')}</table>`
   +dtab(['No','Dimensi Profil Lulusan','Capaian'],DPL.map((n,i)=>[i+1,'DPL '+(i+1)+': '+n,LVN[k.dim[i+1]]||'-']))
   +(db.projek.length?`<p style="margin-top:10px"><b>Projek</b></p>`+dtab(['No','Projek','Capaian'],db.projek.map((p,i)=>[i+1,p.judul,LVN[k.proyek[p.id]]||'-'])):'')
   +`<p style="margin-top:10px"><b>Ringkasan</b></p><p class="pw" style="border:1px solid #000;padding:6px;min-height:50px">${esc(k.ringkasan)}</p>`

function localKar(s,k){
  const n=s.nama.trim().split(/\s+/)[0],hi=DPL.filter((_,i)=>['C','M'].includes(k.dim[i+1])).map(x=>x.toLowerCase()),lo=DPL.filter((_,i)=>['B','K'].includes(k.dim[i+1])).map(x=>x.toLowerCase());
  if(!hi.length&&!lo.length)return k.cat.length?`Ananda ${n} terus menunjukkan perkembangan karakter yang baik di kelas.`:'';
  let t=hi.length?`Ananda ${n} menunjukkan perkembangan yang baik pada dimensi ${hi.join(', ')}.`:`Ananda ${n} sedang berproses mengembangkan karakternya.`;
  if(lo.length)t+=` Ananda masih perlu bimbingan dan pembiasaan pada dimensi ${lo.join(', ')}.`;
  return t+' Dukungan guru dan orang tua akan membantu ananda terus berkembang.'
}

}

const JENIS=['Libur','Asesmen/Ujian','Pembagian Rapor','Rapat/Pertemuan','Administrasi/Tenggat','Kegiatan Sekolah','Lainnya'];
const JC={'Libur':'#ff4d6d','Asesmen/Ujian':'#ffb020','Pembagian Rapor':'#00b8a0','Rapat/Pertemuan':'#3b82f6','Administrasi/Tenggat':'#6d4aff','Kegiatan Sekolah':'#16a34a','Lainnya':'#6a6f8f'};
const INGAT=['Tanpa pengingat','Pada hari H','1 hari sebelumnya','3 hari sebelumnya','7 hari sebelumnya'];
const ingatN=v=>{const i=INGAT.indexOf(v);return i<=0?null:[null,0,1,3,7][i]};
const evEnd=e=>e.selesai&&e.selesai>=e.tanggal?e.selesai:e.tanggal;
const evOn=d=>db.kalender.filter(e=>e.tanggal<=d&&d<=evEnd(e));
const daysTo=ds=>Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/864e5);
let calYM=today().slice(0,7),kalImp=false,kalTxt='',kalPrev=[];
MODS.kalender={label:'Kegiatan',col:'kalender',icon:'🔔',fields:[{k:'tanggal',l:'Tanggal Mulai',t:'date',d:'today',req:1},{k:'selesai',l:'Tanggal Selesai (bila lebih dari sehari)',t:'date'},{k:'judul',l:'Nama Kegiatan',req:1},{k:'jenis',l:'Jenis',t:'select',o:JENIS},{k:'ingat',l:'Pengingat',t:'select',o:INGAT},{k:'catatan',l:'Catatan',t:'textarea'}],
  title:r=>r.judul,sub:r=>fmtD(r.tanggal)+(r.selesai&&r.selesai>r.tanggal?' – '+fmtD(r.selesai):''),sort:(a,b)=>a.tanggal.localeCompare(b.tanggal)};
function remItems(){const t=today();return db.kalender.map(e=>({e,du:daysTo(e.tanggal),on:e.tanggal<=t&&t<=evEnd(e)})).filter(x=>x.on||(x.du>0&&x.du<=14)).sort((a,b)=>(a.on?-1:a.du)-(b.on?-1:b.du)).slice(0,6)}
function remCard(){
  if(!db.kalender.length)return '';const L=remItems();
  return `<a class="card tilt" href="#/kalender" style="border-left:6px solid var(--p)"><b>🔔 Pengingat & Agenda</b>${L.length?L.map(({e,du,on})=>{const n=ingatN(e.ingat),hot=on||(n!==null&&du<=n);return `<p style="margin-top:6px;${hot?'font-weight:700':''}"><span class="dot" style="background:${JC[e.jenis]||JC.Lainnya}"></span> ${on?'Hari ini':du===1?'Besok':du+' hari lagi'} — ${esc(e.judul)}${hot&&n!==null?' 🔔':''}</p>`}).join(''):'<p class="mut" style="margin-top:6px">Tidak ada agenda 14 hari ke depan.</p>'}</a>`
}
function makeIcs(list){
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KelasKu//ID','CALSCALE:GREGORIAN','X-WR-CALNAME:KelasKu'];
  list.forEach(e=>{
    L.push('BEGIN:VEVENT',`UID:${e.id}@kelasku`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${e.tanggal.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(evEnd(e),1).replace(/-/g,'')}`,`SUMMARY:${esc2(e.judul)}`);
    if(e.catatan||e.jenis)L.push(`DESCRIPTION:${esc2([e.jenis,e.catatan].filter(Boolean).join(' — '))}`);
    const n=ingatN(e.ingat);if(n!==null)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2(e.judul)}`,`TRIGGER:${n===0?'PT7H':n===1?'-PT17H':`-P${n-1}DT17H`}`,'END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')
}

/* ---------- 1. TINDAK LANJUT NILAI (remedial & pengayaan) ---------- */
let tlM='';
const tlKey=(mid,tp)=>mid+'|'+tp;
function tlData(mid){
  const S=sortSiswa(),N=db.nilai.filter(n=>n.mapel===mid&&n.nilai!==''&&n.nilai!=null&&db.siswa.some(s=>s.id===n.siswa)),k=kktp();
  const mk=(label,tp,f)=>{
    const per=S.map(s=>{const v=N.filter(n=>n.siswa===s.id&&f(n)).map(n=>+n.nilai);return v.length?{s,avg:Math.round(v.reduce((a,b)=>a+b,0)/v.length)}:null}).filter(Boolean);
    return{label,tp,total:per.length,rem:per.filter(x=>x.avg<k),ayn:per.filter(x=>x.avg>=90),tuntas:per.filter(x=>x.avg>=k).length}};
  const tps=[...new Set(N.map(n=>(n.tp||'').trim()).filter(Boolean))];
  return[mk('Keseluruhan nilai','',()=>true),...tps.map(t=>mk(t,t,n=>(n.tp||'').trim()===t))].filter(g=>g.total)
}
function localTl(tp){

    ayn:{kegiatan:[`Soal tantangan tingkat lanjut${t} yang menuntut penalaran.`,'Menjadi tutor sebaya bagi teman yang belum tuntas.','Membuat proyek mini atau penjelasan sederhana yang mengaitkan materi dengan kehidupan sehari-hari.'],soal:[]},ai:false}
}

const waLink=(h,t)=>`https://wa.me/${waNum(h)}?text=${encodeURIComponent(t)}`;
function absInfo(sid){
  const ym=today().slice(0,7),c={S:0,I:0,A:0},A=[];
  Object.keys(db.absensi).filter(d=>d.startsWith(ym)).sort().forEach(d=>{const v=(db.absensi[d]||{})[sid];if(c[v]!==undefined){c[v]++;if(v==='A')A.push(+d.slice(8))}});
  return{c,A,bln:monthLabel(ym)}
}
const hariTgl=d=>d?HARI[new Date(d+'T00:00').getDay()]+', '+fmtD(d):'';
function suratBuild(){
  const j=srt.jenis,s=db.siswa.find(x=>x.id===srt.sid),n=s?s.nama:'{nama}',kelas=db.guru.kelas||'-';
  const wkt=[srt.tgl?`Hari/Tanggal : ${hariTgl(srt.tgl)}`:'',srt.jam?`Waktu           : ${srt.jam}`:'',srt.tempat?`Tempat          : ${srt.tempat}`:''].filter(Boolean).join('\n');
  const tutup='Atas perhatian dan kerja sama Bapak/Ibu, kami ucapkan terima kasih.';
  if(j==='undangan')return `Dengan hormat,\n\nSehubungan dengan ${srt.hal||'pembahasan perkembangan belajar peserta didik'}, kami mengundang Bapak/Ibu orang tua/wali dari ananda ${n} untuk hadir pada:\n\n${wkt||'Hari/Tanggal : …\nWaktu           : …\nTempat          : …'}${srt.detail?'\nAcara           : '+srt.detail:''}\n\nMengingat pentingnya pertemuan tersebut, kami berharap Bapak/Ibu dapat hadir tepat waktu. ${tutup}`;
  if(j==='absen'){
    if(!s)return'';const a=absInfo(s.id);
    return `Dengan hormat,\n\nBerdasarkan catatan kehadiran bulan ${a.bln}, ananda ${n} (kelas ${kelas}) tercatat Sakit ${a.c.S} hari, Izin ${a.c.I} hari, dan Tanpa Keterangan (Alpa) ${a.c.A} hari.${a.A.length?` Ketidakhadiran tanpa keterangan terjadi pada tanggal ${a.A.join(', ')}.`:''}\n\nKami mohon Bapak/Ibu berkenan memberikan keterangan dan membantu ananda agar dapat hadir secara teratur, karena kehadiran sangat berpengaruh pada kelancaran belajar.${srt.detail?'\n\n'+srt.detail:''}\n\n${tutup}`}
  if(j==='remedial'){
    if(!s)return'';const L=raporData(s.id).filter(d=>d.rata<kktp()).map(d=>`${d.nama} (rata-rata ${d.rata})`);
    return `Dengan hormat,\n\nBerdasarkan hasil penilaian, ananda ${n} (kelas ${kelas}) masih memerlukan pendampingan pada ${L.length?'mata pelajaran berikut:\n- '+L.join('\n- '):'beberapa mata pelajaran'}.\n\nSekolah akan melaksanakan pembelajaran remedial${srt.tgl||srt.jam||srt.tempat?' pada:\n'+wkt:'.'}\n\nKami mohon dukungan Bapak/Ibu untuk mendampingi ananda belajar di rumah dan memastikan ananda mengikuti kegiatan tersebut.${srt.detail?'\n\n'+srt.detail:''}\n\n${tutup}`}
  if(j==='apresiasi')return `Dengan hormat,\n\nKami menyampaikan apresiasi atas perkembangan ananda ${n} (kelas ${kelas}) yang menunjukkan sikap dan semangat belajar yang baik di sekolah.${srt.detail?' '+srt.detail:''}\n\nSemoga dukungan Bapak/Ibu di rumah terus membantu ananda berkembang. ${tutup}`;
  return `Dengan hormat,\n\n${srt.detail||'[Tulis isi pengumuman di sini]'}${wkt?'\n\n'+wkt:''}\n\n${tutup}`
}

let jrOpen=false;
const rppLines=t=>String(t||'').split(/\r?\n/).map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean);
const rppSum=(t,n=3,max=230)=>{const a=rppLines(t).slice(0,n).join('; ');return a.length>max?a.slice(0,max-1).trimEnd()+'…':a};
function jurnalDraft(r,tgl){
  const mp=db.mapel.find(m=>m.nama.trim().toLowerCase()===String(r.mapel||'').trim().toLowerCase());
  const kg=[['Kegiatan awal',r.awal],['Memahami',r.memahami],['Mengaplikasi',r.mengaplikasi],['Merefleksi',r.merefleksi],['Penutup',r.penutup]].map(([l,t])=>{const s=rppSum(t);return s?`${l}: ${s}`:''}).filter(Boolean).join('\n');
  return{id:uid(),tanggal:tgl||today(),mapel:mp?mp.id:'',materi:r.topik+(r.tp?'\nTujuan: '+rppSum(r.tp,2,260):''),kegiatan:kg,refleksi:''}
}
function jurCard(){
  if(!db.rpp.length||db.jurnal.some(j=>j.tanggal===today())||!db.jadwal.some(j=>j.hari===HARI[new Date().getDay()]))return'';
  return `<div class="card tilt" style="border-left:6px solid var(--a)"><b>📖 Jurnal hari ini belum diisi</b><p class="mut" style="margin:6px 0 10px">Buat drafnya dari RPP, tinggal melengkapi refleksi.</p><button class="btn a s" data-act="jurnalOpen">✨ Draf dari RPP</button></div>`
}

};

const hdrKey=x=>String(x??'').toLowerCase().replace(/[^a-z]/g,'');
const NORMN=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const cl=x=>String(x??'').trim();
const mdRows=t=>{const L=String(t).split(/\r?\n/).filter(l=>l.includes('|'));const rows=L.filter(l=>!/^[\s|:\-]+$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.replace(/<br\s*\/?>/gi,' ').trim()));return rows.length>=2?rows:null};
const xlDate=n=>{n=+n;if(!(n>20000&&n<80000))return'';return new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5).toISOString().slice(0,10)};
const BLN={januari:1,jan:1,februari:2,feb:2,pebruari:2,maret:3,mar:3,april:4,apr:4,mei:5,juni:6,jun:6,juli:7,jul:7,agustus:8,agu:8,agt:8,ags:8,september:9,sep:9,sept:9,oktober:10,okt:10,november:11,nov:11,nopember:11,desember:12,des:12};
function dateOf(x){
  x=cl(x);if(!x)return'';
  let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

  save();return L.length
}

function kartuHtml(s,D){
  const g=db.guru,r=D.rows.find(x=>x.s.id===s.id),t=r?r.t:{H:0,S:0,I:0,A:0},nl=raporData(s.id),k=KG(s.id),R=db.rapor[s.id]||{},cat=R.wali||db.catatan[s.id]||'',dm=DPL.map((n,i)=>k.dim[i+1]?[n,LVN[k.dim[i+1]]]:null).filter(Boolean);
  const rata=nl.length?Math.round(nl.reduce((a,x)=>a+x.rata,0)/nl.length*10)/10:null;
  return hasil('KARTU PERKEMBANGAN PESERTA DIDIK')
   +`<table style="border:0;margin:6px 0">${[['Nama',s.nama],['NIS',s.nis||'-'],['Kelas',g.kelas||'-'],['Semester',g.semester+' • TA '+g.tahun]].map(([a,b])=>`<tr><td style="border:0" width="20%"><b>${a}</b></td><td style="border:0">: ${esc(b)}</td></tr>`).join('')}</table>`
   +`<p style="margin-top:8px"><b>Kehadiran</b></p>`+dtab(['Hadir','Sakit','Izin','Alpa','% Hadir'],[[t.H,t.S,t.I,t.A,r&&r.pct!=null?r.pct+'%':'-']])
   +`<p style="margin-top:8px"><b>Capaian Belajar</b></p>`+dtab(['No','Mata Pelajaran','Nilai','Capaian'],[...nl.map((d,i)=>[i+1,d.nama,d.rata,predikat(d.rata)]),...(rata!==null?[['','Rata-rata',rata,predikat(rata)]]:[])])
   +(dm.length?`<p style="margin-top:8px"><b>Karakter (Dimensi Profil Lulusan)</b></p>`+dtab(['Dimensi','Capaian'],dm):'')
   +`<p style="margin-top:8px"><b>Catatan Wali Kelas</b></p><p class="pw" style="border:1px solid #000;padding:6px;min-height:46px;white-space:pre-wrap">${esc(cat)}</p>`
}
function kartuWa(s,D){
  const g=db.guru,r=D.rows.find(x=>x.s.id===s.id),t=r?r.t:{H:0,S:0,I:0,A:0},nl=raporData(s.id),R=db.rapor[s.id]||{},cat=R.wali||db.catatan[s.id]||'';

view.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.ncs){e.preventDefault();const all=[...view.querySelectorAll('input[data-ncs]')],i=all.indexOf(t);if(all[i+1])all[i+1].focus();else t.blur()}});
['impor','nilaicepat','kartu','tahun'].forEach(k=>PAGES[k]=defs[k]);
{const tmp={...PAGES};Object.keys(PAGES).forEach(k=>delete PAGES[k]);['dashboard','guru','impor','siswa','mapel','kalender','rpp','perangkat','soal','asesmen','jadwal','absensi','absrekap','nilai','nilaicepat','leger','tl','karakter','rapor','kartu','jurnal','surat','rekap','excel','wali','tahun','setting'].forEach(k=>{if(tmp[k])PAGES[k]=tmp[k]})}



/* ---------- foto / berkas materi untuk pembuat soal ---------- */
let soalSrcList=[];
const soalSrcHtml=()=>soalSrcList.map(x=>`<div class="mut" style="font-size:13px;margin-top:4px">${esc(x.name)} — ${esc(x.st)}</div>`).join('');
async function soalSrc(files){
  if(!soalEdit||!files.length)return;
  soalSrcList=[];
  for(const f of files){
    const it={name:f.name||'foto kamera',st:'⏳ Membaca…'};soalSrcList.push(it);soalPage(view);
    try{const t=(await readSource(f)).trim();
      if(t){soalEdit.sumber_teks=((soalEdit.sumber_teks?soalEdit.sumber_teks+'\n\n':'')+`[Sumber: ${it.name}]\n`+t).slice(0,20000);it.st=`✅ Terbaca (${t.length} huruf)`}
      else it.st='⚠ Tidak ada teks terbaca — coba foto lebih jelas dan terang'}
    catch(e){it.st='⚠ '+String(e.message||e).slice(0,100)}
    soalPage(view)}
  toast('Materi dibaca — periksa teksnya, lalu tekan Buat Soal')
}
Object.assign(ACT,{soalCam:()=>$('#scam').click(),soalUp:()=>$('#sup').click()});
view.addEventListener('change',e=>{const t=e.target;if(t.id==='scam'||t.id==='sup'){const fs=[...t.files];t.value='';soalSrc(fs)}});

/* ===== navigasi ===== */
const nav=$('#drawer');
nav.innerHTML=Object.entries(PAGES).map(([k,p])=>`<div class="ni" data-p="${k}" role="link" tabindex="0"><span class="ic">${p.icon}</span>${p.label}</div>`).join('');
nav.insertAdjacentHTML('beforeend','<div class="ncr"><b>KelasKu</b><br>Design by Akhmad Fitra Harry, S.Pd</div>');
const closeNav=()=>{nav.classList.remove('open');$('#ov').classList.remove('on')};
nav.addEventListener('click',e=>{const n=e.target.closest('.ni');if(!n)return;const p=n.dataset.p;if(p==='rpp')rppEdit=null;if(p==='perangkat')perEdit=null;if(p==='soal')soalEdit=null;if(p==='siswa')imp=null;if(location.hash==='#/'+p){go()}else location.hash='#/'+p;closeNav()});
$('#burger').onclick=()=>{nav.classList.toggle('open');$('#ov').classList.toggle('on')};
$('#ov').onclick=closeNav;
$('#mc').onclick=()=>$('#modal').classList.remove('on');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('on')});
function go(){
  const p=location.hash.slice(2)||'dashboard',pg=PAGES[p]||PAGES.dashboard,k=PAGES[p]?p:'dashboard';
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.p===k));
  $('#ptitle').textContent=pg.label;document.title='KelasKu — '+pg.label;pg.render(view);
}
function ini(){const n=(db.guru.nama||'Guru').trim().split(/\s+/);$('#av').textContent=((n[0]||'G')[0]+(n[1]||n[0]||'R')[0]).toUpperCase()}
window.addEventListener('hashchange',()=>{closeNav();go();scrollTo(0,0)});

/* ===== efek 3D: miring mengikuti kursor + kubus latar ===== */
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const c=e.target.closest&&e.target.closest('.tilt');if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(800px) rotateX(${-y*7}deg) rotateY(${x*9}deg) translateZ(6px)`});
document.addEventListener('pointerleave',e=>{if(e.target.classList&&e.target.classList.contains('tilt'))e.target.style.transform=''},true);
$('#bg').innerHTML=[[6,12,46],[82,8,64],[90,52,38],[8,62,58],[48,84,44],[70,78,30]].map(([l,t,s],i)=>`<div class="fl" style="left:${l}%;top:${t}%;animation-delay:-${i*1.4}s"><div class="cube bg" style="--s:${s}px;animation-duration:${14+i*3}s">${'<i></i>'.repeat(6)}</div></div>`).join('');

if(driveReady()&&(db.siswa.length||db.rpp.length||db.nilai.length)&&(!db.setting.lastBackup||Date.now()-db.setting.lastBackup>864e5))pendBk=true;
ini();go();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
